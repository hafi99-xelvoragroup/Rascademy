<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090604" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Rascademy — Platform Belajar Matematika Berbasis Konsep</title>

  <!-- Inline SVG Favicon (Prevents 404 favicon.ico error on GitHub Pages) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23090604'/%3E%3Cline x1='17' y1='67' x2='67' y2='17' stroke='%23F97316' stroke-width='7'/%3E%3Cpolygon points='24,71 74,71 74,21' fill='%23FDE6D2'/%3E%3Cline x1='83' y1='21' x2='83' y2='71' stroke='%23F97316' stroke-width='7'/%3E%3Cline x1='24' y1='80' x2='74' y2='80' stroke='%23F97316' stroke-width='7'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- KaTeX CSS & Auto-Render JS for Crisp Mathematical Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="if (typeof renderAllMath === 'function') renderAllMath();"></script>

  <style>
    :root {
      /* Base Obsidian, Molten Amber & Warm Alabaster Palette */
      --bg-outer: #030201;
      --bg-app: #080604;
      --surface-card: linear-gradient(180deg, rgba(26, 15, 9, 0.94) 0%, rgba(15, 9, 5, 0.98) 100%);
      --surface-subcard: rgba(14, 9, 6, 0.80);
      --surface-input: #110A06;

      --amber-500: #F97316;
      --amber-400: #FB923C;
      --gold-400: #FBBF24;
      --gold-200: #FDE6C4;

      --accent-gradient: linear-gradient(135deg, #F97316 0%, #EA580C 55%, #D97706 100%);
      --progress-gradient: linear-gradient(90deg, #EA580C 0%, #F97316 55%, #FBBF24 100%);

      /* Dynamic Ambis Flame Intensity Variables */
      --shell-border: rgba(249, 115, 22, 0.16);
      --shell-glow: 0 0 50px rgba(0, 0, 0, 0.92);
      --ambient-top: rgba(249, 115, 22, 0.08);
      --ambient-mid: rgba(217, 119, 6, 0.04);
      --ambient-bot: rgba(234, 88, 12, 0.06);
      --border-subtle: rgba(245, 158, 11, 0.20);
      --border-glow: rgba(251, 146, 60, 0.45);
      --border-strong: rgba(251, 191, 36, 0.72);
      --glow-card: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(253, 230, 196, 0.06);
      --glow-active: 0 0 22px rgba(249, 115, 22, 0.24), inset 0 1px 0 rgba(251, 191, 36, 0.14);
      --glow-btn: 0 4px 18px rgba(249, 115, 22, 0.42);

      /* Cohesive Typography Colors */
      --text-primary: #FAF5EE;
      --text-secondary: #C9B8A8;
      --text-muted: #8C7A6B;

      /* Semantic Colors */
      --success: #4ADE80;
      --success-bg: rgba(74, 222, 128, 0.10);
      --success-border: rgba(74, 222, 128, 0.34);

      --error: #F87171;
      --error-bg: rgba(248, 113, 113, 0.10);
      --error-border: rgba(248, 113, 113, 0.34);

      --concept-bg: rgba(249, 115, 22, 0.12);
      --concept-border: rgba(251, 191, 36, 0.36);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --radius-pill: 999px;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ==========================================================================
       CUMULATIVE AMBIS FLAME TIERS (0 = Stealth Obsidian -> 5 = Molten Rim)
       ========================================================================== */
    #app-shell.flame-tier-0 {
      --bg-app: #070504;
      --shell-border: rgba(249, 115, 22, 0.16);
      --shell-glow: 0 0 50px rgba(0, 0, 0, 0.92);
      --ambient-top: rgba(249, 115, 22, 0.06);
      --ambient-mid: rgba(217, 119, 6, 0.03);
      --ambient-bot: rgba(234, 88, 12, 0.05);
      --border-subtle: rgba(245, 158, 11, 0.18);
      --border-glow: rgba(251, 146, 60, 0.36);
      --glow-card: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 245, 235, 0.05);
      --glow-active: 0 0 18px rgba(249, 115, 22, 0.18), inset 0 1px 0 rgba(251, 191, 36, 0.12);
    }

    #app-shell.flame-tier-1 {
      --bg-app: #080604;
      --shell-border: rgba(249, 115, 22, 0.36);
      --shell-glow: 0 0 55px rgba(249, 115, 22, 0.18);
      --ambient-top: rgba(249, 115, 22, 0.12);
      --ambient-mid: rgba(234, 88, 12, 0.06);
      --ambient-bot: rgba(217, 119, 6, 0.10);
      --border-subtle: rgba(249, 115, 22, 0.28);
      --border-glow: rgba(251, 146, 60, 0.56);
      --glow-card: 0 8px 26px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(253, 230, 196, 0.10);
      --glow-active: 0 0 24px rgba(249, 115, 22, 0.28), inset 0 1px 0 rgba(251, 191, 36, 0.22);
    }

    #app-shell.flame-tier-2 {
      --bg-app: #090604;
      --shell-border: rgba(251, 146, 60, 0.55);
      --shell-glow: 0 0 65px rgba(249, 115, 22, 0.26);
      --ambient-top: rgba(249, 115, 22, 0.16);
      --ambient-mid: rgba(245, 158, 11, 0.08);
      --ambient-bot: rgba(234, 88, 12, 0.14);
      --border-subtle: rgba(251, 146, 60, 0.36);
      --border-glow: rgba(251, 191, 36, 0.68);
      --glow-card: 0 8px 28px rgba(0, 0, 0, 0.65), 0 0 16px rgba(249, 115, 22, 0.08), inset 0 1px 0 rgba(251, 191, 36, 0.16);
      --glow-active: 0 0 28px rgba(249, 115, 22, 0.36), inset 0 1px 0 rgba(251, 191, 36, 0.28);
    }

    #app-shell.flame-tier-3 {
      --bg-app: #0A0705;
      --shell-border: rgba(251, 191, 36, 0.72);
      --shell-glow: 0 0 75px rgba(249, 115, 22, 0.34);
      --ambient-top: rgba(251, 146, 60, 0.20);
      --ambient-mid: rgba(249, 115, 22, 0.10);
      --ambient-bot: rgba(251, 191, 36, 0.18);
      --border-subtle: rgba(251, 191, 36, 0.44);
      --border-glow: rgba(251, 191, 36, 0.80);
      --glow-card: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 20px rgba(249, 115, 22, 0.12), inset 0 1px 0 rgba(253, 230, 196, 0.22);
      --glow-active: 0 0 34px rgba(251, 146, 60, 0.44), inset 0 1px 0 rgba(253, 230, 196, 0.34);
    }

    #app-shell.flame-tier-4 {
      --bg-app: #0B0705;
      --shell-border: rgba(253, 224, 71, 0.86);
      --shell-glow: 0 0 88px rgba(251, 146, 60, 0.44);
      --ambient-top: rgba(251, 191, 36, 0.24);
      --ambient-mid: rgba(249, 115, 22, 0.12);
      --ambient-bot: rgba(251, 191, 36, 0.22);
      --border-subtle: rgba(253, 224, 71, 0.52);
      --border-glow: rgba(253, 224, 71, 0.90);
      --glow-card: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 24px rgba(251, 146, 60, 0.16), inset 0 1px 0 rgba(255, 251, 235, 0.28);
      --glow-active: 0 0 40px rgba(251, 191, 36, 0.54), inset 0 1px 0 rgba(255, 251, 235, 0.42);
    }

    #app-shell.flame-tier-5 {
      --bg-app: #0C0805;
      --shell-border: #FDE047;
      --shell-glow: 0 0 100px rgba(251, 191, 36, 0.55);
      --ambient-top: rgba(253, 224, 71, 0.28);
      --ambient-mid: rgba(249, 115, 22, 0.15);
      --ambient-bot: rgba(251, 191, 36, 0.26);
      --border-subtle: rgba(253, 224, 71, 0.62);
      --border-glow: #FEF08A;
      --glow-card: 0 10px 34px rgba(0, 0, 0, 0.65), 0 0 28px rgba(251, 191, 36, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.34);
      --glow-active: 0 0 46px rgba(253, 224, 71, 0.64), inset 0 1px 0 rgba(255, 255, 255, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: var(--font-sans);
      color: var(--text-primary);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-outer);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    /* Main Responsive App Shell */
    #app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-app);
      background-image:
        radial-gradient(circle at 85% 10%, var(--ambient-top) 0%, transparent 48%),
        radial-gradient(circle at 12% 48%, var(--ambient-mid) 0%, transparent 52%),
        radial-gradient(circle at 75% 88%, var(--ambient-bot) 0%, transparent 52%);
      position: relative;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--shell-border);
      border-right: 1px solid var(--shell-border);
      box-shadow: var(--shell-glow);
      transition: background-color 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
    }

    /* Hardware-Accelerated Foreground Rim-Fire Canvas (Centered reliably across all browsers) */
    #foreground-fire-canvas {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      pointer-events: none;
      z-index: 45;
    }

    h1, h2, h3, .font-display {
      font-family: var(--font-display);
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .text-display { font-size: 1.42rem; font-weight: 800; line-height: 1.22; color: var(--text-primary); }
    .text-heading { font-size: 1.06rem; font-weight: 700; line-height: 1.32; color: var(--text-primary); }
    .text-subheading { font-size: 0.91rem; font-weight: 600; line-height: 1.38; color: var(--text-primary); }
    .text-body { font-size: 0.84rem; color: var(--text-secondary); }
    .text-caption { font-size: 0.74rem; color: var(--text-muted); }
    .text-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-400); }

    /* ==========================================================================
       1. SPLASH SCREEN
       ========================================================================== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #050302;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-fire-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .splash-center-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .rascademy-logo-glow {
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 24px rgba(249, 115, 22, 0.7));
      animation: logoFloat 2.2s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    .splash-loader-track {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 24px;
    }

    .splash-loader-bar {
      height: 100%;
      width: 0%;
      background: var(--progress-gradient);
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.85);
      animation: loadSplash 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes loadSplash {
      to { width: 100%; }
    }

    /* ==========================================================================
       2. MISSION FLAME IGNITION CELEBRATION OVERLAY
       ========================================================================== */
    #mission-flame-overlay {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: rgba(5, 3, 2, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInOverlay 0.25s ease forwards;
    }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #mission-flame-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .flame-celebration-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, rgba(42, 22, 10, 0.96) 0%, rgba(16, 9, 5, 0.98) 100%);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 0 56px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(253, 230, 196, 0.22);
      animation: popFlameCard 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popFlameCard {
      from { opacity: 0; transform: translateY(16px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .flame-medallion {
      width: 84px;
      height: 84px;
      margin: 0 auto 14px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(253, 224, 71, 0.38), rgba(249, 115, 22, 0.16) 65%, transparent 100%);
      border: 1.5px solid var(--gold-400);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 34px rgba(249, 115, 22, 0.72);
      animation: flamePulseAura 1.6s ease-in-out infinite;
    }

    @keyframes flamePulseAura {
      0%, 100% { transform: scale(1); box-shadow: 0 0 26px rgba(249, 115, 22, 0.58); }
      50% { transform: scale(1.07); box-shadow: 0 0 42px rgba(253, 224, 71, 0.9); }
    }

    /* ==========================================================================
       3. TOP BAR HEADER
       ========================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(10, 6, 4, 0.88);
      backdrop-filter: blur(12px);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(249, 115, 22, 0.12);
    }

    .user-header-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .circle-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(36, 20, 11, 0.92);
      border: 1px solid var(--border-subtle);
      color: var(--amber-400);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.16s ease;
    }

    .circle-icon-btn:hover {
      border-color: var(--border-glow);
      box-shadow: var(--glow-active);
      color: #FFFBF7;
    }

    .ambis-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      background: rgba(42, 22, 10, 0.94);
      border: 1px solid var(--border-glow);
      font-family: var(--font-display);
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--gold-400);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--glow-active);
    }

    .ambis-pill:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       4. MAIN VIEWPORT & CARDS
       ========================================================================== */
    #main-content {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 12px 16px calc(104px + env(safe-area-inset-bottom, 0px)) 16px;
      overflow-y: auto;
    }

    .ember-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--glow-card);
      transition: border-color 0.45s ease, box-shadow 0.45s ease;
    }

    .ember-card-glow {
      position: relative;
      background: linear-gradient(165deg, rgba(32, 18, 10, 0.96) 0%, rgba(14, 9, 6, 0.98) 100%);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--glow-active);
      transition: border-color 0.45s ease, box-shadow 0.45s ease;
    }

    .ember-card-glow::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 16%;
      right: 16%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--gold-400), #FFFBEB, var(--gold-400), transparent);
      opacity: 0.78;
      pointer-events: none;
    }

    .ember-subcard {
      background: var(--surface-subcard);
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .icon-square-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(44, 24, 12, 0.92);
      border: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-400);
      flex-shrink: 0;
      box-shadow: inset 0 0 14px rgba(249, 115, 22, 0.18);
    }

    .icon-square-box.sm {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Buttons & Pills */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-ember {
      background: var(--accent-gradient);
      color: #FFFFFF;
      box-shadow: var(--glow-btn);
    }

    .btn-ember:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-pill {
      border-radius: var(--radius-pill);
      padding: 9px 18px;
    }

    .btn-outline-ember {
      background: rgba(30, 17, 9, 0.88);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .btn-outline-ember:hover:not(:disabled) {
      border-color: var(--border-glow);
      background: rgba(46, 25, 13, 0.92);
    }

    .btn-danger-ember {
      background: var(--error-bg);
      color: #FCA5A5;
      border-color: var(--error-border);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.76rem;
    }

    .btn-full {
      width: 100%;
    }

    /* Official Google Sign-In Button */
    .btn-google {
      width: 100%;
      background: #FFFDF9;
      color: #1A1410;
      border: 1px solid rgba(253, 230, 196, 0.85);
      border-radius: var(--radius-pill);
      padding: 12px 18px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 16px rgba(249, 115, 22, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .btn-google:hover {
      background: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55), 0 0 22px rgba(251, 191, 36, 0.35);
    }

    .google-account-row {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(28, 16, 9, 0.92);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .google-account-row:hover {
      border-color: var(--gold-400);
      background: rgba(46, 26, 13, 0.96);
      box-shadow: var(--glow-active);
    }

    .google-avatar-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.45);
    }

    .chip-action {
      background: rgba(34, 19, 10, 0.9);
      border: 1px solid var(--border-subtle);
      color: var(--gold-400);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-action:hover {
      border-color: var(--border-glow);
      color: var(--text-primary);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .badge-ember { background: rgba(249, 115, 22, 0.18); color: var(--gold-400); border: 1px solid rgba(251, 146, 60, 0.42); }
    .badge-concept { background: var(--concept-bg); color: var(--gold-200); border: 1px solid var(--concept-border); }
    .badge-success { background: var(--success-bg); color: #86EFAC; border: 1px solid var(--success-border); }
    .badge-error { background: var(--error-bg); color: #FCA5A5; border: 1px solid var(--error-border); }
    .badge-neutral { background: rgba(255, 245, 235, 0.05); color: var(--text-secondary); border: 1px solid rgba(245, 158, 11, 0.18); }

    /* Glowing Progress Bar */
    .ember-progress-track {
      width: 100%;
      height: 9px;
      background: rgba(10, 6, 3, 0.92);
      border: 1px solid rgba(249, 115, 22, 0.25);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .ember-progress-fill {
      height: 100%;
      background: var(--progress-gradient);
      border-radius: var(--radius-pill);
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.75);
      transition: width 0.45s ease;
    }

    /* Segmented Pill Switcher */
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: var(--radius-pill);
      background: rgba(16, 9, 5, 0.94);
      border: 1px solid var(--border-subtle);
    }

    .mode-switch-btn {
      padding: 9px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .mode-switch-btn.active {
      background: linear-gradient(180deg, rgba(67, 32, 12, 0.95) 0%, rgba(36, 18, 8, 0.95) 100%);
      border-color: var(--border-glow);
      color: #FFFFFF;
      box-shadow: var(--glow-active);
    }

    /* Timeline List */
    .timeline-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 16px;
    }

    .timeline-list::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      background: linear-gradient(180deg, var(--amber-500), rgba(249, 115, 22, 0.2));
    }

    .timeline-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      background: rgba(28, 16, 9, 0.72);
      border: 1px solid rgba(249, 115, 22, 0.16);
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -16px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber-500);
      box-shadow: 0 0 8px var(--amber-500);
    }

    /* Forms & Inputs */
    .form-group { margin-bottom: 13px; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 11px 14px;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--text-primary);
      background: var(--surface-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--amber-500);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }

    .input-with-action {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-action .form-input {
      padding-right: 44px;
    }

    .input-eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-eye-btn:hover {
      color: var(--gold-400);
    }

    .gender-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gender-option {
      padding: 11px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--surface-input);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .gender-option.selected {
      border-color: var(--amber-500);
      background: rgba(249, 115, 22, 0.18);
      color: #FFFFFF;
      box-shadow: var(--glow-active);
    }

    /* Quiz & Battle Option Cards */
    .option-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(22, 13, 7, 0.92);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.14s ease;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--text-primary);
    }

    .option-card:hover:not(:disabled) {
      border-color: var(--border-glow);
      background: rgba(42, 24, 13, 0.94);
    }

    .option-card.selected {
      border-color: var(--amber-500);
      background: rgba(249, 115, 22, 0.2);
      box-shadow: var(--glow-active);
    }

    .option-card.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .option-card.incorrect {
      border-color: var(--error);
      background: var(--error-bg);
    }

    .option-key {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(46, 26, 14, 0.95);
      border: 1px solid var(--border-subtle);
      color: var(--amber-400);
      font-weight: 700;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-card.selected .option-key {
      background: var(--amber-500);
      color: #FFFFFF;
      border-color: var(--amber-400);
    }

    /* Digital Whiteboard Canvas Player */
    .whiteboard-container {
      background: #070504;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-glow);
      box-shadow: var(--glow-active);
    }

    .whiteboard-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #080604;
    }

    canvas#whiteboard-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .whiteboard-controls {
      padding: 12px 14px;
      background: #140C07;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scrubber-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      cursor: pointer;
    }

    .scrubber-fill {
      height: 100%;
      background: var(--progress-gradient);
      border-radius: 999px;
    }

    /* Inline Banner */
    .inline-banner {
      padding: 11px 13px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      line-height: 1.48;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--text-secondary);
    }

    .inline-banner strong { color: var(--text-primary); }
    .inline-banner.ember { background: rgba(249, 115, 22, 0.11); color: var(--text-secondary); border: 1px solid rgba(249, 115, 22, 0.34); }
    .inline-banner.concept { background: var(--concept-bg); color: var(--gold-200); border: 1px solid var(--concept-border); }
    .inline-banner.success { background: var(--success-bg); color: #DCFCE7; border: 1px solid var(--success-border); }
    .inline-banner.error { background: var(--error-bg); color: #FEE2E2; border: 1px solid var(--error-border); }

    /* Bottom Navigation Dock */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, rgba(20, 12, 7, 0.96) 0%, rgba(10, 6, 4, 0.99) 100%);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-glow);
      border-radius: 22px 22px 0 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px calc(12px + env(safe-area-inset-bottom, 0px)) 4px;
      z-index: 40;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.72), 0 -2px 18px rgba(249, 115, 22, 0.18);
    }

    .bottom-nav::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 10%;
      right: 10%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--amber-500), var(--gold-400), var(--amber-500), transparent);
      opacity: 0.9;
      pointer-events: none;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 2px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.67rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item.active {
      color: var(--amber-400);
    }

    .nav-item.active svg {
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.8));
    }

    .nav-sublabel {
      font-size: 0.56rem;
      opacity: 0.85;
      line-height: 1;
    }

    /* Pair 7-Day Streak Circles */
    .streak-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .streak-day-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .streak-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      border: 1px solid var(--border-subtle);
      background: rgba(20, 12, 7, 0.9);
      color: var(--text-muted);
    }

    .streak-circle.lit {
      background: var(--accent-gradient);
      border-color: var(--gold-400);
      color: #FFFFFF;
      box-shadow: 0 0 18px rgba(249, 115, 22, 0.78);
      animation: flamePulseAura 2.2s ease-in-out infinite;
    }

    /* Modal / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 3, 2, 0.78);
      backdrop-filter: blur(4px);
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .modal-sheet {
      width: 100%;
      max-width: 456px;
      max-height: 85vh;
      overflow-y: auto;
      background: #160D07;
      border-radius: var(--radius-xl);
      padding: 20px;
      border: 1px solid var(--border-glow);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
    }

    /* Utility Layout Helpers */
    .stack-xs { display: flex; flex-direction: column; gap: 6px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }
    .stack-md { display: flex; flex-direction: column; gap: 14px; }
    .stack-lg { display: flex; flex-direction: column; gap: 18px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row-center { display: flex; align-items: center; gap: 9px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .divider { height: 1px; background: rgba(249, 115, 22, 0.16); margin: 10px 0; }
    .hidden { display: none !important; }

    .katex { font-size: 1.02em; color: var(--text-primary); }
  </style>
</head>

  <!-- MODAL / BOTTOM SHEET CONTAINER -->

  <script>
    /* ==========================================================================
       RASCADEMY — STANDALONE STATIC WEB APPLICATION (GITHUB PAGES READY)
       ========================================================================== */

    // --------------------------------------------------------------------------
    // 1. VECTOR ICONS & GRAPHICS ASSETS
    // --------------------------------------------------------------------------
    let splashAnimFrame = null;
    let missionFlameAnimFrame = null;
    let foregroundFireAnimFrame = null;

    const ICONS = {
      flame: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor"><path d="M12.9 2.3c.3-.3.8-.1.8.4 0 2.3 1.4 3.8 2.9 5.3 1.6 1.6 3.4 3.4 3.4 6.5 0 4.3-3.5 7.5-8 7.5s-8-3.2-8-7.5c0-2.5 1.2-4.6 2.8-6.3.3-.3.9-.1.8.4-.2 1.2.2 2.3 1 3 .2-2.9 1.7-5.8 4.3-8.3z"/></svg>`,

      trophy: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`,
      chart: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
      bolt: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,

      medal: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>`,
      target: (size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,

    function findLessonById(lessonId) {
      for (const course of LEARNING_DATA.courses) {
        for (const ch of course.chapters) {
          const found = ch.lessons.find(l => l.id === lessonId);
          if (found) return found;
        }
      }
      return LEARNING_DATA.courses[0].chapters[0].lessons[0];
    }

    function getContinueLearningTarget() {
      const allLessons = LEARNING_DATA.courses.flatMap(c => c.chapters.flatMap(ch => ch.lessons));
      const nextLesson = allLessons.find(l => !appState.lessonProgress[l.id]?.completed) || allLessons[0];
      const prog = appState.lessonProgress[nextLesson.id] || {};
      let step = 'video';
      if (prog.videoDone && !prog.summaryDone) step = 'summary';
      else if (prog.summaryDone && !prog.exampleDone) step = 'example';
      else if (prog.exampleDone && !prog.completed) step = 'quiz';
      return {
        lesson: nextLesson,
        step,
        label: prog.completed ? 'Ulangi Materi >' : 'Lanjutkan >'
      };
    }

    function computeOverallStats() {
      const allLessons = LEARNING_DATA.courses.flatMap(c => c.chapters.flatMap(ch => ch.lessons));
      const totalLessons = allLessons.length;
      const completedLessons = allLessons.filter(l => appState.lessonProgress[l.id]?.completed).length;

      const practiceHistory = appState.practiceState.history || [];
      const practiceCount = practiceHistory.length;
      const totalQuestionsSolved = practiceHistory.reduce((acc, h) => acc + h.totalQuestions, 0);
      const avgAccuracy = practiceCount > 0
        ? Math.round(practiceHistory.reduce((acc, h) => acc + h.accuracy, 0) / practiceCount)
        : 0;

      const matchHistory = appState.competitionState.history || [];
      const matchCount = matchHistory.length;
      const matchWins = matchHistory.filter(m => m.outcome === 'Menang').length;

      const activeDays = Math.max(appState.pairState.streakDays || 0, appState.activityHistory.length > 0 ? 1 : 0);
      const totalMilestones = totalLessons + 3;
      const achievedMilestones = completedLessons + Math.min(2, practiceCount) + Math.min(1, matchCount);
      const overallPct = Math.min(100, Math.round((achievedMilestones / totalMilestones) * 100));

      return {
        totalLessons,
        completedLessons,
        practiceCount,
        totalQuestionsSolved,
        avgAccuracy,
        matchCount,
        matchWins,
        activeDays,
        overallPct,
        ambisLevel: appState.ambisLevel || 0
      };
    }

    // --------------------------------------------------------------------------
    // 4. PRE-RENDERED OFFSCREEN FLAME SPRITE ATLAS (60FPS LOCKED)
    // --------------------------------------------------------------------------
    let flameSpriteAtlas = null;

    function getFlameSpriteAtlas() {
      if (flameSpriteAtlas) return flameSpriteAtlas;

      function buildGlowSprite(size, c0, c1, c2) {
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const octx = off.getContext('2d');
        const r = size / 2;
        const g = octx.createRadialGradient(r, r, r * 0.05, r, r, r);
        g.addColorStop(0, c0);
        g.addColorStop(0.45, c1);
        g.addColorStop(1, c2);
        octx.fillStyle = g;
        octx.fillRect(0, 0, size, size);
        return off;
      }

      flameSpriteAtlas = {
        goldCore: buildGlowSprite(64, 'rgba(255, 250, 220, 0.95)', 'rgba(251, 191, 36, 0.55)', 'rgba(249, 115, 22, 0)'),
        amberFlame: buildGlowSprite(64, 'rgba(253, 186, 116, 0.85)', 'rgba(249, 115, 22, 0.42)', 'rgba(180, 28, 0, 0)'),
        crispSpark: buildGlowSprite(24, 'rgba(255, 251, 235, 1)', 'rgba(251, 191, 36, 0.75)', 'rgba(249, 115, 22, 0)')
      };
      return flameSpriteAtlas;
    }

    function spawnRimFlameParticle(particles, xMin, xMax, yBase, scale = 1, zone = 'dock') {
      const x = xMin + Math.random() * (xMax - xMin);
      particles.push({
        x,
        y: yBase + (Math.random() - 0.5) * 3,
        vx: (Math.random() - 0.5) * 0.45 * scale,
        vy: -(0.75 + Math.random() * 1.15) * scale,
        life: 0,
        maxLife: zone === 'dock' ? (20 + Math.random() * 16) : (32 + Math.random() * 24),
        size: (zone === 'dock' ? (11 + Math.random() * 9) : (6 + Math.random() * 6)) * scale,
        seed: Math.random() * 60,
        isSpark: Math.random() < (zone === 'edge' ? 0.55 : 0.25),
        zone
      });
    }

    function drawAtlasFlameParticle(ctx, atlas, p, time) {
      const progress = p.life / p.maxLife;
      if (progress >= 1) return false;

      const sway = Math.sin(time * 6.5 + p.seed + progress * 4.5) * (2.6 * progress);
      p.x += p.vx + sway * 0.12;
      p.y += p.vy;
      p.life += 1;

      const alpha = Math.sin(progress * Math.PI) * (p.zone === 'dock' ? 0.78 : 0.65);
      if (alpha <= 0.02) return true;

      ctx.globalAlpha = alpha;
      if (p.isSpark) {
        const s = Math.max(4, p.size * 0.48 * (1 - progress * 0.5));
        ctx.drawImage(atlas.crispSpark, p.x - s * 0.5, p.y - s * 0.5, s, s);
      } else {
        const w = p.size * 0.72 * (1 - progress * 0.55);
        const h = p.size * 1.38 * (1 - progress * 0.45);
        const sprite = progress < 0.38 ? atlas.goldCore : atlas.amberFlame;
        ctx.drawImage(sprite, p.x - w * 0.5, p.y - h * 0.65, w, h);
      }
      return true;
    }

    function initAmbientEmberLoop() {
      const canvas = document.getElementById('foreground-fire-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const atlas = getFlameSpriteAtlas();

      function resizeCanvas() {
        const shell = document.getElementById('app-shell');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const cssW = shell ? shell.clientWidth : Math.min(window.innerWidth, 480);
        const cssH = window.innerHeight;
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let flameParticles = [];
      let time = 0;

      function renderForegroundFire() {
        if (document.hidden) {
          foregroundFireAnimFrame = requestAnimationFrame(renderForegroundFire);
          return;
        }

        time += 0.032;
        const shell = document.getElementById('app-shell');
        const W = shell ? shell.clientWidth : Math.min(window.innerWidth, 480);
        const H = window.innerHeight;
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';

        const isLoggedIn = Boolean(appState.currentUser);
        const lvl = isLoggedIn ? (appState.ambisLevel || 0) : 0;

        if (isLoggedIn) {
          const navEl = document.getElementById('bottom-nav');
          const navRect = navEl && !navEl.classList.contains('hidden') ? navEl.getBoundingClientRect() : null;
          const navTopY = navRect ? navRect.top : (H - 64);

          const activeTabIdx = ['belajar', 'cerdas-cermat', 'latsol', 'pair', 'profil'].indexOf(appState.activeTab);
          const tabWidth = W / 5;
          const activeCenterX = (Math.max(0, activeTabIdx) + 0.5) * tabWidth;

          const crownCount = 1 + Math.min(2, Math.floor(lvl / 2));
          for (let i = 0; i < crownCount; i++) {
            spawnRimFlameParticle(
              flameParticles,
              activeCenterX - tabWidth * 0.34,
              activeCenterX + tabWidth * 0.34,
              navTopY + 1,
              0.75 + lvl * 0.10,
              'dock'
            );
          }

          if (lvl >= 1 && Math.random() < (0.35 + lvl * 0.13)) {
            spawnRimFlameParticle(
              flameParticles,
              18,
              W - 18,
              navTopY + 2,
              0.68 + lvl * 0.09,
              'dock'
            );
          }

          if (lvl >= 1 && Math.random() < (0.22 + lvl * 0.14)) {
            const onLeftBezel = Math.random() < 0.5;
            spawnRimFlameParticle(
              flameParticles,
              onLeftBezel ? 3 : W - 14,
              onLeftBezel ? 14 : W - 3,
              navTopY - 12,
              0.65 + lvl * 0.08,
              'edge'
            );
          }
        } else {
          if (Math.random() < 0.35) {
            const onLeft = Math.random() < 0.5;
            spawnRimFlameParticle(flameParticles, onLeft ? 4 : W - 14, onLeft ? 14 : W - 4, H - 40, 0.7, 'edge');
          }
        }

        if (flameParticles.length > 75) {
          flameParticles.splice(0, flameParticles.length - 75);
        }

        flameParticles = flameParticles.filter(p => drawAtlasFlameParticle(ctx, atlas, p, time));
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        foregroundFireAnimFrame = requestAnimationFrame(renderForegroundFire);
      }

      if (foregroundFireAnimFrame) cancelAnimationFrame(foregroundFireAnimFrame);
      renderForegroundFire();
    }

    function runSmoothFlameCanvas(canvasEl, getAnimIdRef) {
      if (!canvasEl) return;
      const ctx = canvasEl.getContext('2d');
      const atlas = getFlameSpriteAtlas();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = window.innerWidth;
      const cssH = window.innerHeight;
      canvasEl.width = Math.round(cssW * dpr);
      canvasEl.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      let particles = [];
      let time = 0;

      function renderFire() {
        time += 0.035;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(5, 3, 2, 0.30)';
        ctx.fillRect(0, 0, cssW, cssH);

        ctx.globalCompositeOperation = 'lighter';
        const cx = cssW / 2;
        const cy = cssH / 2 + 24;

        for (let i = 0; i < 3; i++) {
          spawnRimFlameParticle(particles, cx - 75, cx + 75, cy + 18, 1.35, 'dock');
        }
        if (particles.length > 90) {
          particles.splice(0, particles.length - 90);
        }

        particles = particles.filter(p => drawAtlasFlameParticle(ctx, atlas, p, time));
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        getAnimIdRef(requestAnimationFrame(renderFire));
      }

      renderFire();
    }

      appState.ambisLevel = account.workspace.ambisLevel || 0;

      appState.competitionState = account.workspace.competitionState;
      appState.pairState = account.workspace.pairState;

        };

      wbProgress = appState.lessonProgress[lessonId].videoPct >= 100 ? 0 : (appState.lessonProgress[lessonId].videoPct || 0);
      appState.learningView = { mode: 'lesson', lessonId, subStep };
      saveState();
      renderApp();
    }

      stopWhiteboardPlayback();
      appState.learningView = { mode: 'home', lessonId: null, subStep: 'video' };
      saveState();
      renderApp();

      if (step === 'example') appState.lessonProgress[lessonId].exampleDone = true;
      saveState();
      renderApp();
    }

    function toggleWhiteboardPlay(lessonId) {
      const lesson = findLessonById(lessonId);
      const btn = document.getElementById('wb-play-btn');
      if (wbPlaying) {
        stopWhiteboardPlayback();
        if (btn) btn.textContent = '▶ Lanjutkan';
        return;
      }
      wbPlaying = true;
      if (btn) btn.textContent = '❚❚ Jeda';
      let last = performance.now();
      function loop(now) {
        if (!wbPlaying) return;
        const dt = (now - last) / 1000;
        last = now;
        wbProgress = Math.min(100, wbProgress + dt * 9);
        appState.lessonProgress[lessonId].videoPct = Math.round(wbProgress);
        const fill = document.getElementById('wb-scrubber-fill');
        const lbl = document.getElementById('wb-time-label');
        if (fill) fill.style.width = wbProgress + '%';
        if (lbl) lbl.textContent = `${Math.round(wbProgress)}% • ${lesson.duration}`;
        drawEmberWhiteboard(lesson, wbProgress);
        if (wbProgress >= 100) {
          stopWhiteboardPlayback();
          completeVideoNow(lessonId);
          return;
        }
        wbAnimId = requestAnimationFrame(loop);
      }
      wbAnimId = requestAnimationFrame(loop);
    }

    function scrubWhiteboard(e, lessonId) {
      const rect = e.currentTarget.getBoundingClientRect();
      wbProgress = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      appState.lessonProgress[lessonId].videoPct = Math.round(wbProgress);
      saveState();
      const lesson = findLessonById(lessonId);
      drawEmberWhiteboard(lesson, wbProgress);
      renderApp();
    }

    function completeVideoNow(lessonId) {
      stopWhiteboardPlayback();
      wbProgress = 100;
      appState.lessonProgress[lessonId].videoPct = 100;
      appState.lessonProgress[lessonId].videoDone = true;
      saveState();
      renderApp();
    }

    function drawEmberWhiteboard(lesson, pct) {
      const canvas = document.getElementById('whiteboard-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;

      ctx.fillStyle = '#080604';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(249, 115, 22, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      let activeStep = lesson.whiteboardSteps[0];
      for (const s of lesson.whiteboardSteps) { if (pct >= s.time) activeStep = s; }

      ctx.fillStyle = '#180E08';
      ctx.fillRect(22, 18, W - 44, 38);
      ctx.strokeStyle = 'rgba(249, 115, 22, 0.35)';
      ctx.strokeRect(22, 18, W - 44, 38);
      ctx.fillStyle = '#FB923C';
      ctx.font = '700 14px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(activeStep.title, 36, 42);

      const ox = 170, oy = 255;
      ctx.strokeStyle = '#78685A';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(45, oy); ctx.lineTo(305, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, 85); ctx.lineTo(ox, 330); ctx.stroke();

      ctx.strokeStyle = '#FBBF24';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (lesson.id === 'lsn_limit_01') {
        ctx.moveTo(75, 290); ctx.lineTo(220, 145); ctx.stroke();
        ctx.fillStyle = '#080604';
        ctx.beginPath(); ctx.arc(225, 140, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#F97316';
        ctx.stroke();
      } else {
        for (let px = -85; px <= 90; px += 2) {
          const sx = ox + px, sy = oy - (px * px) / 52;
          if (px === -85) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(24, 14, 8, 0.88)';
      ctx.fillRect(328, 78, 288, 255);
      ctx.strokeStyle = 'rgba(249, 115, 22, 0.35)';
      ctx.strokeRect(328, 78, 288, 255);

      ctx.fillStyle = '#FB923C';
      ctx.font = '700 11px "Inter", sans-serif';
      ctx.fillText('PERSAMAAN INTI', 346, 106);

      ctx.fillStyle = '#FFFBF7';
      ctx.font = '600 13px "JetBrains Mono", monospace';
      const cleanF = activeStep.formula.replace(/\\quad|\\text\{|\}|\\frac|\\lim_|\\to|\\iff|\\pmod/g, ' ').replace(/\s+/g, ' ').trim();
      wrapText(ctx, cleanF, 346, 132, 252, 20);

      ctx.fillStyle = '#FBBF24';
      ctx.font = '700 11px "Inter", sans-serif';
      ctx.fillText('PENALARAN KONSEP', 346, 195);

      ctx.fillStyle = '#D6C7B8';
      ctx.font = '400 12px "Inter", sans-serif';
      wrapText(ctx, activeStep.note, 346, 218, 252, 18);
    }

    function wrapText(ctx, text, x, y, maxW, lh) {
      const words = text.split(' ');
      let line = '';
      for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (ctx.measureText(test).width > maxW && i > 0) {
          ctx.fillText(line, x, y);
          line = words[i] + ' ';
          y += lh;
        } else line = test;
      }
      ctx.fillText(line, x, y);
    }

      const pool = user.gender === 'Laki-laki' ? maleNames : femaleNames;
      const opponentName = pool[Math.floor(Math.random() * pool.length)];

      matchQueueTimer = setTimeout(() => {
        const qs = [...QUESTION_BANK].sort(() => 0.5 - Math.random()).slice(0, 4);
        appState.competitionState.match = {
          id: 'mtc_' + Date.now(),
          opponentName,
          questions: qs,
          currentIndex: 0,
          userScore: 0,
          opponentScore: 0,

          phase: 'rebutan',

          eliminatedOption: null,

    function cancelBattleQueue() {

    function triggerOpponentAnswer(isRebound) {
      if (opponentActionTimer) clearTimeout(opponentActionTimer);
      opponentActionTimer = setTimeout(() => {
        const m = appState.competitionState.match;
        if (!m || appState.competitionState.view !== 'battle') return;
        if (m.phase !== 'opponent_turn' && m.phase !== 'rebound_opponent') return;

        const q = m.questions[m.currentIndex];
        const availableIndices = [0, 1, 2, 3].filter(i => i !== m.eliminatedOption);
        const accuracyChance = isRebound ? 0.52 : 0.48;
        const opponentRight = Math.random() < accuracyChance;

        if (opponentRight) {
          m.opponentScore += 100;
          m.phase = 'reveal';
          m.chosenOption = q.correctIndex;
          m.juryMessage = isRebound
            ? `Lemparan berhasil dijawab ${m.opponentName} (${String.fromCharCode(65 + q.correctIndex)})! +100 poin.`
            : `Jawaban ${m.opponentName} (${String.fromCharCode(65 + q.correctIndex)}) benar! +100 poin.`;
          renderApp();
          opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1250);
        } else {
          const wrongOpts = availableIndices.filter(i => i !== q.correctIndex);
          const pickedWrong = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];

          if (!isRebound) {
            m.opponentScore -= 50;
            m.eliminatedOption = pickedWrong;
            m.phase = 'rebound_user';
            m.timeLeft = 8;
            m.juryMessage = `Jawaban ${m.opponentName} (${String.fromCharCode(65 + pickedWrong)}) salah (-50 poin)! Soal dilempar ke kamu (aman jika salah, +100 jika benar)!`;
            renderApp();
            startRebutanCountdown();
          } else {
            m.chosenOption = pickedWrong;
            m.phase = 'reveal';
            m.juryMessage = `Lemparan ke ${m.opponentName} (${String.fromCharCode(65 + pickedWrong)}) salah (skor lawan tetap aman). Kunci jawaban: (${String.fromCharCode(65 + q.correctIndex)}).`;
            renderApp();
            opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1350);
          }
        }
      }, 1350);
    }

    function startRebutanCountdown() {
      if (battleTickTimer) clearInterval(battleTickTimer);
      let opponentBuzzDelay = 3 + Math.floor(Math.random() * 4);

      battleTickTimer = setInterval(() => {
        const m = appState.competitionState.match;
        if (!m || appState.competitionState.view !== 'battle') {
          clearInterval(battleTickTimer);
          return;
        }

        m.timeLeft--;

        if (m.phase === 'rebutan') {
          opponentBuzzDelay--;
          if (opponentBuzzDelay <= 0) {
            clearInterval(battleTickTimer);
            m.phase = 'opponent_turn';
            m.timeLeft = 6;
            m.juryMessage = `${m.opponentName} lebih cepat menekan tombol! Sedang memilih jawaban...`;
            renderApp();
            triggerOpponentAnswer(false);
            return;
          }
        }

        if (m.timeLeft <= 0) {
          clearInterval(battleTickTimer);
          const q = m.questions[m.currentIndex];
          if (m.phase === 'user_turn') {
            m.userScore -= 50;
            m.phase = 'rebound_opponent';
            m.timeLeft = 6;
            m.juryMessage = `Waktu menjawabmu habis (-50 poin)! Pertanyaan dilempar ke ${m.opponentName}...`;
            renderApp();
            triggerOpponentAnswer(true);
          } else if (m.phase === 'rebound_user') {
            m.phase = 'reveal';
            m.juryMessage = `Waktu lemparan habis (skormu tetap aman). Kunci jawaban: (${String.fromCharCode(65 + q.correctIndex)}).`;
            renderApp();
            opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1250);
          } else {
            m.phase = 'reveal';
            m.juryMessage = `Waktu rebutan habis! Tidak ada yang menekan tombol. Kunci jawaban: (${String.fromCharCode(65 + q.correctIndex)}).`;
            renderApp();
            opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1250);
          }
        } else {
          renderApp();
        }
      }, 1000);
    }

    function pressBuzzerFirst() {
      const m = appState.competitionState.match;
      if (!m || m.phase !== 'rebutan') return;
      m.phase = 'user_turn';
      m.timeLeft = 10;
      m.juryMessage = 'Kamu lebih cepat menekan tombol! Pilih jawaban (Benar +100, Salah -50).';
      renderApp();
    }

    function passReboundQuestion() {
      const m = appState.competitionState.match;
      if (!m || m.phase !== 'rebound_user') return;
      if (battleTickTimer) clearInterval(battleTickTimer);
      const q = m.questions[m.currentIndex];
      m.phase = 'reveal';
      m.juryMessage = `Kamu melewati soal lemparan (skormu tetap aman). Kunci jawaban: (${String.fromCharCode(65 + q.correctIndex)}).`;
      renderApp();
      opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1250);
    }

    function chooseBattleOption(optIdx) {
      const m = appState.competitionState.match;
      if (!m || (m.phase !== 'user_turn' && m.phase !== 'rebound_user')) return;
      if (battleTickTimer) clearInterval(battleTickTimer);

      const q = m.questions[m.currentIndex];
      const wasFirstTurn = m.phase === 'user_turn';

      if (optIdx === q.correctIndex) {
        m.userScore += 100;
        m.chosenOption = optIdx;
        m.phase = 'reveal';
        m.juryMessage = wasFirstTurn
          ? `Tepat sekali! Jawaban (${String.fromCharCode(65 + optIdx)}) benar. +100 poin untuk kamu!`
          : `Lemparan berhasil dijawab! Jawaban (${String.fromCharCode(65 + optIdx)}) benar. +100 poin!`;
        renderApp();
        opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1250);
      } else if (wasFirstTurn) {
        m.userScore -= 50;
        m.eliminatedOption = optIdx;
        m.phase = 'rebound_opponent';
        m.timeLeft = 6;
        m.juryMessage = `Jawaban kamu (${String.fromCharCode(65 + optIdx)}) salah (-50 poin)! Pertanyaan dilempar ke ${m.opponentName}...`;
        renderApp();
        triggerOpponentAnswer(true);
      } else {
        m.chosenOption = optIdx;
        m.phase = 'reveal';
        m.juryMessage = `Jawaban lemparan (${String.fromCharCode(65 + optIdx)}) kurang tepat, namun skormu tetap aman! Kunci jawaban: (${String.fromCharCode(65 + q.correctIndex)}).`;
        renderApp();
        opponentActionTimer = setTimeout(() => advanceBattleQuestion(), 1350);
      }
    }

    function exitBattleArena() {
      if (battleTickTimer) clearInterval(battleTickTimer);
      if (matchQueueTimer) clearTimeout(matchQueueTimer);
      if (opponentActionTimer) clearTimeout(opponentActionTimer);
      appState.competitionState.view = 'lobby';
      appState.competitionState.match = null;
      saveState();
      renderApp();
    }

    function resetBattleLobby() {
      appState.competitionState.view = 'lobby';
      appState.competitionState.match = null;
      saveState();
      renderApp();
    }

    function advanceBattleQuestion() {
      if (opponentActionTimer) clearTimeout(opponentActionTimer);
      const m = appState.competitionState.match;
      if (!m) return;
      if (m.currentIndex + 1 < m.questions.length) {
        m.currentIndex++;
        m.timeLeft = 10;
        m.phase = 'rebutan';
        m.eliminatedOption = null;
        m.chosenOption = null;
        m.juryMessage = 'Juri membacakan pertanyaan. Siapa cepat menekan tombol berhak menjawab!';
        renderApp();
        startRebutanCountdown();
      } else {
        if (battleTickTimer) clearInterval(battleTickTimer);
        m.outcome = m.userScore > m.opponentScore ? 'Menang' : (m.userScore === m.opponentScore ? 'Seri' : 'Kalah');
        appState.competitionState.history.unshift({
          id: m.id,
          opponentName: m.opponentName,
          userScore: m.userScore,
          opponentScore: m.opponentScore,
          outcome: m.outcome,
          playedAt: 'Hari ini, ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        });
        appState.competitionState.view = 'result';
        recordUserActivity('competition', `Cerdas Cermat vs ${m.opponentName}`, `${m.outcome} (${m.userScore} - ${m.opponentScore})`);
        const ignition = igniteMissionFlameAndStreak();
        saveState();
        triggerMissionFlameCelebration({
          title: m.outcome === 'Menang' ? 'Kemenangan Cerdas Cermat!' : 'Duel Cerdas Cermat Selesai!',
          subtitle: `Skor akhir ${m.userScore} - ${m.opponentScore} melawan ${m.opponentName}.`,
          badgeText: `HASIL DUEL: ${m.outcome.toUpperCase()}`,
          ignition
        });
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && appState.activeTab === 'cerdas-cermat' && appState.competitionState.view === 'battle') {
        const m = appState.competitionState.match;
        if (m && m.phase === 'rebutan') {

        }
      }
    });

    function startLatsolByTopic(topicId) {
      let pool = topicId === 'all'
        ? [...QUESTION_BANK]
        : QUESTION_BANK.filter(q => q.topic === topicId);
      if (pool.length < 3) {
        const others = QUESTION_BANK.filter(q => q.topic !== topicId);
        pool = [...pool, ...others].slice(0, 3);
      } else {
        pool = pool.sort(() => 0.5 - Math.random()).slice(0, 4);
      }

      const topicObj = LATSOL_TOPICS.find(t => t.id === topicId) || { name: 'Matematika Campuran' };
      appState.practiceState.session = {
        id: 'prc_' + Date.now(),
        topicName: topicObj.name,
        questions: pool,
        answers: {},
        correctCount: 0,
        accuracy: 0
      };
      appState.practiceState.view = 'session';
      saveState();
      renderApp();
    }

    function selectLatsolOpt(qId, optIdx) {
      if (!appState.practiceState.session) return;
      appState.practiceState.session.answers[qId] = optIdx;
      renderApp();
    }

    function cancelLatsolSession() {
      appState.practiceState.view = 'setup';
      appState.practiceState.session = null;
      renderApp();
    }

    function submitLatsolSession() {
      const s = appState.practiceState.session;
      if (!s) return;
      let ok = 0;
      s.questions.forEach(q => {
        if (s.answers[q.id] === q.correctIndex) ok++;
      });
      const score = Math.round((ok / s.questions.length) * 100);
      s.correctCount = ok;
      s.accuracy = score;

      appState.practiceState.history.unshift({
        id: s.id,
        topicName: s.topicName,
        totalQuestions: s.questions.length,
        correctCount: ok,
        accuracy: score
      });

      appState.practiceState.view = 'result';
      recordUserActivity('practice', `Menyelesaikan Latsol ${s.topicName}`, `Skor ${score}% (${ok}/${s.questions.length})`);
      pushPairLog(`${appState.currentUser.displayName} menyelesaikan Latsol ${s.topicName} (${score}%)`);
      const ignition = igniteMissionFlameAndStreak();
      saveState();
      triggerMissionFlameCelebration({
        title: `Misi Latsol Selesai!`,
        subtitle: `Topik ${s.topicName} tuntas dengan akurasi ${score}% (${ok}/${s.questions.length} benar).`,
        badgeText: `LATSOL TUNTAS • ${score}%`,
        ignition
      });
    }

    function closeLatsolResult() {
      appState.practiceState.view = 'setup';
      appState.practiceState.session = null;

    }

    }

    function openEditPairTargetModal() {
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal-sheet stack-md" onclick="event.stopPropagation()">
            <div class="row-between">
              <h3 class="text-heading">Ubah Target Belajar Pair</h3>
              <button class="circle-icon-btn" style="width: 30px; height: 30px;" onclick="closeModal()">✕</button>
            </div>
            <input class="form-input" id="pair-target-val" type="text" value="${appState.pairState.target}" />
            <button class="btn btn-ember btn-pill btn-full" onclick="savePairTarget()">Simpan Target &gt;</button>
          </div>
        </div>
      `;
    }

    function savePairTarget() {
      const v = document.getElementById('pair-target-val').value.trim();
      if (v) {
        appState.pairState.target = v;
        saveState();
      }
      closeModal();
      renderApp();
    }

    // --------------------------------------------------------------------------
    // 11. TAB 5: PROFIL & PENGATURAN
    // --------------------------------------------------------------------------
    function renderProfilTab() {
      if (appState.settingsView !== 'main') {
        renderSettingsSubpage(appState.settingsView);
        return;
      }

      const user = appState.currentUser;
      const stats = computeOverallStats();
      const tier = getAmbisTierInfo(stats.ambisLevel);
      const main = document.getElementById('main-content');

      main.innerHTML = `
        <div class="stack-md">
          <div class="ember-card-glow row-center" style="gap: 14px;">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(24, 14, 8, 0.95); border: 2px solid var(--amber-500); box-shadow: 0 0 24px rgba(249, 115, 22, 0.55); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="36" height="36" viewBox="0 0 100 100" fill="none">
                <line x1="17" y1="67" x2="67" y2="17" stroke="#FDE6D2" stroke-width="6.5"/>
                <polygon points="24,71 74,71 74,21" fill="#FDE6D2"/>
                <line x1="83" y1="21" x2="83" y2="71" stroke="#FDE6D2" stroke-width="6.5"/>
                <line x1="24" y1="80" x2="74" y2="80" stroke="#FDE6D2" stroke-width="6.5"/>
              </svg>
            </div>

            <div style="flex: 1; min-width: 0;">
              <h1 class="text-heading" style="font-size: 1.15rem;">${user.displayName}</h1>
              <div class="text-caption" style="margin-top: 2px;">${user.gradeLevel} • ${user.gender}</div>

              <div onclick="openAmbisStatusModal()" class="ember-card row-between" style="margin-top: 10px; padding: 9px 12px; border-radius: 12px; cursor: pointer;">
                <div class="row-center">
                  <span style="color: var(--gold-400); display: flex;">${ICONS.flame(17)}</span>
                  <div>
                    <div class="font-display" style="font-weight: 800; font-size: 0.94rem; color: var(--text-primary);">Nyala Lv.${stats.ambisLevel} (${tier.name})</div>
                    <div class="text-caption" style="font-size: 0.66rem;">Progres ${stats.overallPct}% • Ketuk untuk detail</div>
                  </div>
                </div>
                <span style="color: var(--text-muted);">&gt;</span>
              </div>
            </div>
          </div>

          <div class="ember-card stack-sm">
            <div class="row-center">
              <span style="color: var(--gold-400); display: flex;">${ICONS.trophy(17)}</span>
              <span class="text-subheading">Statistik Belajar</span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 4px;">
              <div style="border-right: 1px solid var(--border-subtle); padding: 4px;">
                <div style="color: var(--amber-400); display: flex; justify-content: center;">${ICONS.book(16)}</div>
                <div class="font-display" style="font-weight: 800; font-size: 1.1rem; margin-top: 3px; color: var(--text-primary);">${stats.completedLessons}</div>
                <div class="text-caption" style="font-size: 0.63rem;">Materi Selesai</div>
              </div>
              <div style="border-right: 1px solid var(--border-subtle); padding: 4px;">
                <div style="color: var(--gold-400); display: flex; justify-content: center;">${ICONS.check(16)}</div>
                <div class="font-display" style="font-weight: 800; font-size: 1.1rem; margin-top: 3px; color: var(--text-primary);">${stats.practiceCount}</div>
                <div class="text-caption" style="font-size: 0.63rem;">Latihan Selesai</div>
              </div>
              <div style="border-right: 1px solid var(--border-subtle); padding: 4px;">
                <div style="color: var(--gold-400); display: flex; justify-content: center;">${ICONS.trophy(16)}</div>
                <div class="font-display" style="font-weight: 800; font-size: 1.1rem; margin-top: 3px; color: var(--text-primary);">${stats.matchWins}</div>
                <div class="text-caption" style="font-size: 0.63rem;">Menang Duel</div>
              </div>
              <div style="padding: 4px;">
                <div style="color: var(--amber-500); display: flex; justify-content: center;">${ICONS.flame(16)}</div>
                <div class="font-display" style="font-weight: 800; font-size: 1.1rem; margin-top: 3px; color: var(--text-primary);">Lv.${stats.ambisLevel}</div>
                <div class="text-caption" style="font-size: 0.63rem;">Nyala Ambis</div>
              </div>
            </div>
          </div>

          <div class="stack-xs">
            <button onclick="openSettingsSubpage('history')" class="ember-card row-between" style="cursor: pointer; padding: 12px 14px;">
              <div class="row-center">
                <div class="icon-square-box sm" style="width: 34px; height: 34px; border-radius: 50%; color: var(--gold-400);">${ICONS.chart(15)}</div>
                <span class="text-subheading" style="font-size: 0.88rem;">Riwayat Aktivitas</span>
              </div>
              <span style="color: var(--text-muted);">&gt;</span>
            </button>

            <button onclick="openSettingsSubpage('achievements')" class="ember-card row-between" style="cursor: pointer; padding: 12px 14px;">
              <div class="row-center">
                <div class="icon-square-box sm" style="width: 34px; height: 34px; border-radius: 50%; color: var(--gold-400);">${ICONS.medal(15)}</div>
                <span class="text-subheading" style="font-size: 0.88rem;">Pencapaian</span>
              </div>
              <span style="color: var(--text-muted);">&gt;</span>
            </button>

            <button onclick="openSettingsSubpage('settings')" class="ember-card row-between" style="cursor: pointer; padding: 12px 14px;">
              <div class="row-center">
                <div class="icon-square-box sm" style="width: 34px; height: 34px; border-radius: 50%; color: var(--gold-400);">${ICONS.target(15)}</div>
                <span class="text-subheading" style="font-size: 0.88rem;">Pengaturan Akun & Target Belajar</span>
              </div>
              <span style="color: var(--text-muted);">&gt;</span>
            </button>

            <button onclick="openSettingsSubpage('privacy')" class="ember-card row-between" style="cursor: pointer; padding: 12px 14px;">
              <div class="row-center">
                <div class="icon-square-box sm" style="width: 34px; height: 34px; border-radius: 50%; color: var(--gold-400);">${ICONS.shield(15)}</div>
                <span class="text-subheading" style="font-size: 0.88rem;">Kebijakan Privasi & Ketentuan</span>
              </div>
              <span style="color: var(--text-muted);">&gt;</span>
            </button>
          </div>

          <button class="btn btn-danger-ember btn-pill btn-full" onclick="handleLogout()">
            Keluar dari Akun
          </button>
        </div>
      `;
    }

    function openSettingsSubpage(v) { appState.settingsView = v; renderApp(); }

    function renderSettingsSubpage(viewName) {
      const user = appState.currentUser;
      const stats = computeOverallStats();
      const main = document.getElementById('main-content');
      let html = '';

      if (viewName === 'history') {
        html = `
          <div class="ember-card stack-sm">
            <h2 class="text-heading">Riwayat Aktivitas Kronologis</h2>
            ${appState.activityHistory.length === 0 ? `<p class="text-caption">Belum ada aktivitas tercatat.</p>` : appState.activityHistory.map(a => `
              <div class="ember-subcard">
                <div class="row-between">
                  <span class="text-subheading" style="font-size: 0.83rem;">${a.title}</span>
                  <span class="text-caption" style="font-size: 0.68rem;">${a.occurred_at}</span>
                </div>
                <div class="text-caption">${a.description}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (viewName === 'achievements') {
        html = `
          <div class="ember-card stack-sm">
            <h2 class="text-heading">Pencapaian Pembelajaran</h2>
            ${ACHIEVEMENT_DEFS.map(ach => {
              const unlocked = ach.check(stats);
              return `
                <div class="ember-subcard row-between" style="opacity: ${unlocked ? '1' : '0.6'};">
                  <div>
                    <div class="text-subheading" style="font-size: 0.85rem;">${ach.title}</div>
                    <div class="text-caption">${ach.desc}</div>
                  </div>
                  <span class="badge ${unlocked ? 'badge-success' : 'badge-neutral'}">${unlocked ? 'Tercapai' : 'Terkunci'}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (viewName === 'settings') {
        html = `
          <div class="ember-card-glow stack-md">
            <h2 class="text-heading">Pengaturan Akun & Preferensi</h2>
            <form onsubmit="saveAccountSettings(event)">
              <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input class="form-input" id="set-name" type="text" value="${user.displayName}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Jenjang Pendidikan</label>
                <input class="form-input" id="set-grade" type="text" value="${user.gradeLevel}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Email Akun</label>
                <input class="form-input" type="text" value="${user.email}" disabled />
              </div>
              <div class="form-group">
                <label class="form-label">Jenis Kelamin</label>
                <input class="form-input" type="text" value="${user.gender}" disabled />
              </div>
              <button type="submit" class="btn btn-ember btn-pill btn-full">Simpan Perubahan &gt;</button>
            </form>
          </div>
        `;
      } else if (viewName === 'privacy') {
        html = `
          <div class="ember-card stack-sm">
            <span class="badge badge-concept" style="width: fit-content;">Kebijakan Privasi & Ketentuan</span>
            <h2 class="text-heading">Privasi & Keamanan Pengguna</h2>
            <p class="text-body">• Rascademy menggunakan informasi akademik dan jenis kelamin khusus untuk pencocokan partner belajar dan duel cerdas cermat sesama gender.</p>
            <p class="text-body">• Lingkungan belajar dirancang bebas dari pesan langsung maupun unggahan foto pribadi agar seluruh sesi tetap fokus pada penguasaan materi.</p>
            <p class="text-body">• Berbagi progres belajar pada fitur Pair dapat diatur dan dihentikan kapan saja melalui kontrol privasi akun Anda.</p>
          </div>
        `;
      }

      main.innerHTML = `
        <div class="stack-md">
          <div><button class="chip-action" onclick="openSettingsSubpage('main')">&lt; Kembali ke Profil</button></div>
          ${html}
        </div>
      `;
    }

    function saveAccountSettings(e) {
      e.preventDefault();
      appState.currentUser.displayName = document.getElementById('set-name').value.trim();
      appState.currentUser.gradeLevel = document.getElementById('set-grade').value.trim();
      saveState();
      openSettingsSubpage('main');
    }

    function handleLogout() {
      saveState();
      stopWhiteboardPlayback();
      appState.currentUser = null;
      appState.ambisLevel = 0;
      appState.settingsView = 'main';
      renderApp();
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    // --------------------------------------------------------------------------
    // 12. INITIALIZATION
    // --------------------------------------------------------------------------
    function dismissSplashScreen() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
      if (splashAnimFrame) {
        cancelAnimationFrame(splashAnimFrame);
        splashAnimFrame = null;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        initSplashFireAnimation();
        initAmbientEmberLoop();
        renderApp();
      } catch (err) {
        console.error('Initialization error:', err);
      }
      setTimeout(dismissSplashScreen, 1250);
    });

    // Safety fallback so splash screen never blocks viewport
    setTimeout(dismissSplashScreen, 2200);
  </script>
</body>
</html>

let JP=null;

function joyEnd(){JP=null;JOY.x=JOY.y=0;const k=$('#knob');if(k)k.style.transform='translate3d(0,0,0)'}

/* ---------- EFEK SAKURA & ANGIN ANIME JEPANG (KREATIF & RINGAN) ---------- */
(function initAnimeSakura(){
 const sc=document.getElementById('sakura-fx');
 if(!sc)return;
 const ctx=sc.getContext('2d',{alpha:true});
 let sw=0,sh=0,sdpr=1;

 // Pre-render sprite kelopak sakura gaya anime Jepang (cel-shading + outline tegas lembut + kilau cahaya)
 const animePetals=[
  {base:'#ffb7d5',shade:'#ff6fa8',tip:'#fff5fa',line:'rgba(168,38,94,0.42)'},
  {base:'#ffd0e4',shade:'#ff8ab8',tip:'#ffffff',line:'rgba(180,52,108,0.36)'},
  {base:'#ffe3ef',shade:'#ffa3c7',tip:'#ffffff',line:'rgba(190,70,120,0.32)'}
 ].map(p=>{
  const c=document.createElement('canvas');c.width=48;c.height=54;
  const g=c.getContext('2d');
  g.translate(24,27);

  // Bentuk siluet kelopak sakura anime dengan lekuk khas di ujung (V-notch)
  const drawShape=()=>{
   g.beginPath();
   g.moveTo(0,20);
   g.bezierCurveTo(14,13,19,-2,15,-14);
   g.bezierCurveTo(13,-21,6,-22,2,-16);
   g.lineTo(0,-12);
   g.lineTo(-2,-16);
   g.bezierCurveTo(-6,-22,-13,-21,-15,-14);
   g.bezierCurveTo(-19,-2,-14,13,0,20);
   g.closePath();
  };

  drawShape();
  g.fillStyle=p.base;
  g.fill();

  // Cel-shading dua tingkat khas ilustrasi anime
  g.save();
  g.clip();
  g.fillStyle=p.shade;
  g.beginPath();
  g.ellipse(0,15,13,11,0,0,6.283);
  g.fill();
  g.fillStyle=p.tip;
  g.beginPath();
  g.ellipse(-4,-11,9,7,-.35,0,6.283);
  g.fill();
  g.restore();

  // Outline tipis bergaya anime Jepang
  drawShape();
  g.strokeStyle=p.line;
  g.lineWidth=1.35;
  g.stroke();

  return c;
 });

 // Kelopak sakura terbatas & berguguran secara acak agar nyaman untuk membaca materi
 const MAX_PETALS=13;
 const petals=Array.from({length:MAX_PETALS},(_,i)=>{
  const active=i<5;
  return {
   active,
   wait:active?0:Math.round(90+Math.random()*360),
   x:Math.random()*innerWidth,
   y:active?(Math.random()*innerHeight*.7):-28,
   vx:0,vy:0,
   baseVy:.32+Math.random()*.36,
   baseVx:.12+Math.random()*.24,
   sz:.26+Math.random()*.2,
   sway:Math.random()*6.283,
   swaySpd:.018+Math.random()*.02,
   swayAmp:.35+Math.random()*.45,
   rot:Math.random()*6.283,
   rotSpd:(-.022+Math.random()*.044),
   flip:Math.random()*6.283,
   flipSpd:.028+Math.random()*.034,
   sp:animePetals[i%animePetals.length],
   al:.78+Math.random()*.2,
   glint:Math.random()*6.283
  };
 });

 // Garis angin anime Jepang (kaze streamlines) & kilau cahaya melayang (komorebi)
 const windStreaks=Array.from({length:3},()=>({
  active:false,
  wait:Math.round(140+Math.random()*380),
  x:0,y:0,len:0,amp:0,freq:0,spd:0,prog:0,dir:1
 }));
 const motes=Array.from({length:7},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:1.1+Math.random()*1.6,
  p:Math.random()*6.283,
  vy:-.12-Math.random()*.15
 }));

 let gust=0,gustTarget=0,gustTimer=120;

 function resizeSakura(){
  sdpr=Math.min(devicePixelRatio||1,2);
  sw=innerWidth;sh=innerHeight;
  sc.width=Math.round(sw*sdpr);sc.height=Math.round(sh*sdpr);
 }
 resizeSakura();
 window.addEventListener('resize',resizeSakura);

 function tickAnimeSakura(){
  const inMap=S.user&&S.tab==='belajar'&&!S.les;
  const inDuel=S.user&&S.tab==='duel'&&S.du;
  const disabledMode=!S.user||inMap||inDuel;

  ctx.setTransform(sdpr,0,0,sdpr,0,0);
  ctx.clearRect(0,0,sw,sh);

  if(!disabledMode&&!document.hidden){
   // Siklus hembusan angin anime acak (tenang lalu berhembus anggun)
   if(--gustTimer<=0){
    const blow=Math.random()<.45;
    gustTarget=blow?((Math.random()<.75?1:-1)*(.9+Math.random()*1.3)):0;
    gustTimer=blow?Math.round(90+Math.random()*110):Math.round(180+Math.random()*280);
   }
   gust+=(gustTarget-gust)*.025;

   // Kilau cahaya halus khas latar anime (komorebi sparkles)
   for(let i=0;i<motes.length;i++){
    const m=motes[i];
    m.p+=.03;
    m.x+=gust*.35+Math.sin(m.p)*.15;
    m.y+=m.vy;
    if(m.y<-10){m.y=sh+10;m.x=Math.random()*sw}
    if(m.x<-10)m.x=sw+10;else if(m.x>sw+10)m.x=-10;
    const a=(.25+.45*Math.sin(m.p));
    if(a>.05){
     ctx.fillStyle=`rgba(255,250,235,${a.toFixed(2)})`;
     ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,6.283);ctx.fill();
    }
   }

   // Garis hembusan angin anime (kaze ribbons) yang melintas ringan & tipis
   for(let i=0;i<windStreaks.length;i++){
    const w=windStreaks[i];
    if(!w.active){
     if(--w.wait<=0){
      w.active=true;
      w.dir=gust<-.15?-1:1;
      w.x=w.dir>0?-160:sw+160;
      w.y=sh*(.14+Math.random()*.64);
      w.len=110+Math.random()*95;
      w.amp=6+Math.random()*9;
      w.freq=.024+Math.random()*.012;
      w.spd=(4.2+Math.random()*2.6)*w.dir;
      w.prog=0;
     }
     continue;
    }
    w.x+=w.spd;
    w.prog+=.022;
    const fade=Math.sin(Math.min(1,w.prog)*Math.PI);
    if(w.prog>=1||w.x<-240||w.x>sw+240){
     w.active=false;
     w.wait=Math.round(220+Math.random()*460);
     continue;
    }
    const tailX=w.x-w.len*w.dir;
    const gr=ctx.createLinearGradient(tailX,w.y,w.x,w.y);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(.55,`rgba(255,245,252,${(.38*fade).toFixed(2)})`);
    gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=gr;
    ctx.lineWidth=1.6;
    ctx.lineCap='round';
    ctx.beginPath();
    const steps=14;
    for(let s=0;s<=steps;s++){
     const u=s/steps;
     const px=tailX+(w.x-tailX)*u;
     const py=w.y+Math.sin(px*w.freq+w.prog*4)*w.amp*Math.sin(u*Math.PI);
     s===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
   }

   // Kelopak sakura anime melayang dengan ayunan & putaran kelopak 3D
   for(let i=0;i<MAX_PETALS;i++){
    const p=petals[i];
    if(!p.active){
     if(--p.wait<=0){
      p.active=true;
      if(Math.abs(gust)>.55&&Math.random()<.45){
       p.x=gust>0?-20:sw+20;
       p.y=Math.random()*(sh*.6);
      }else{
       p.x=16+Math.random()*(sw-32);
       p.y=-24;
      }
      p.vx=0;p.vy=p.baseVy;
     }
     continue;
    }

    p.sway+=p.swaySpd;
    p.flip+=p.flipSpd*(1+Math.abs(gust)*.5);
    p.glint+=.05;

    const windPush=gust*(.75+p.sz*1.1);
    p.vx+=(p.baseVx+windPush+Math.cos(p.sway)*p.swayAmp-p.vx)*.04;
    p.vy+=(p.baseVy*(1-Math.min(.35,Math.abs(gust)*.18))-p.vy)*.04;
    p.x+=p.vx+Math.sin(p.sway)*p.swayAmp*.6;
    p.y+=p.vy;
    p.rot+=p.rotSpd+gust*.012;

    if(p.y>sh+26||p.x<-40||p.x>sw+40){
     p.active=false;
     p.wait=Math.round(120+Math.random()*420);
     continue;
    }

    const fy=.34+.66*Math.abs(Math.cos(p.flip));
    const w=48*p.sz,h=54*p.sz;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.scale(1,fy);
    ctx.globalAlpha=p.al;
    ctx.drawImage(p.sp,-w*.5,-h*.5,w,h);

    // Kilau anime glint sesaat saat sudut kelopak memantulkan cahaya
    const flash=Math.sin(p.glint);
    if(flash>.94&&fy>.75){
     ctx.fillStyle=`rgba(255,255,255,${((flash-.94)*12).toFixed(2)})`;
     ctx.beginPath();
     ctx.arc(0,-2,2.4,0,6.283);
     ctx.fill();
    }
    ctx.restore();
   }
  }
  requestAnimationFrame(tickAnimeSakura);
 }
 requestAnimationFrame(tickAnimeSakura);
})();

render();

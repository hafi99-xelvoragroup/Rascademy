      min-height: 100vh;
      background-color: var(--bg-app);
      background-image:

        radial-gradient(circle at 12% 48%, var(--ambient-mid) 0%, transparent 52%),
        radial-gradient(circle at 75% 88%, var(--ambient-bot) 0%, transparent 52%);
      position: relative;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--shell-border);
      border-right: 1px solid var(--shell-border);
      box-shadow: var(--shell-glow);
      transition: background-color 0.6s ease, box-shadow 0.6s ease, border-color 0.6s ease;
      overflow-x: hidden;
    }

    #ambient-ember-canvas {

      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
      z-index: 1;

    .text-display { font-size: 1.42rem; font-weight: 800; line-height: 1.22; color: var(--text-primary); }

    .text-subheading { font-size: 0.91rem; font-weight: 600; line-height: 1.38; color: var(--text-primary); }
    .text-body { font-size: 0.84rem; color: var(--text-secondary); }
    .text-caption { font-size: 0.74rem; color: var(--text-muted); }
    .text-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-400); }

    /* ==========================================================================
       1. SPLASH SCREEN
       ========================================================================== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #050302;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-fire-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .splash-center-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .rascademy-logo-glow {
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 24px rgba(249, 115, 22, 0.7));
      animation: logoFloat 2.2s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    .splash-loader-track {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 24px;
    }

    .splash-loader-bar {
      height: 100%;
      width: 0%;
      background: var(--progress-gradient);
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.85);
      animation: loadSplash 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes loadSplash {
      to { width: 100%; }
    }

    /* ==========================================================================
       2. MISSION FLAME IGNITION CELEBRATION OVERLAY
       ========================================================================== */
    #mission-flame-overlay {
      position: fixed;
      inset: 0;
      z-index: 95;
      background: rgba(5, 3, 2, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInOverlay 0.25s ease forwards;
    }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #mission-flame-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .flame-celebration-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, rgba(42, 22, 10, 0.96) 0%, rgba(16, 9, 5, 0.98) 100%);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 0 56px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(253, 230, 196, 0.22);
      animation: popFlameCard 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popFlameCard {
      from { opacity: 0; transform: translateY(16px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .flame-medallion {
      width: 84px;
      height: 84px;

      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(253, 224, 71, 0.38), rgba(249, 115, 22, 0.16) 65%, transparent 100%);

      align-items: center;
      justify-content: center;
      box-shadow: 0 0 34px rgba(249, 115, 22, 0.72);
      animation: flamePulseAura 1.6s ease-in-out infinite;
    }

    @keyframes flamePulseAura {
      0%, 100% { transform: scale(1); box-shadow: 0 0 26px rgba(249, 115, 22, 0.58); }
      50% { transform: scale(1.07); box-shadow: 0 0 42px rgba(253, 224, 71, 0.9); }
    }

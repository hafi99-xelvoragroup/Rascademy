<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rascademy — Petualangan Konsep Matematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141824;
  --card:#ffffff;
  --bg:#f4f7fb;
  --soft:#f1f5fb;
  --bl:#2563eb;
  --bl-dk:#1d4ed8;
  --bl-lt:#eff6ff;
  --bl-bd:#93c5fd;
  --cy:#38bdf8;
  --cy-lt:#bae6fd;
  --yl:#ffd24c;
  --ok:#dcfce7;
  --ok-bd:#16a34a;
  --ok-txt:#14532d;
  --no:#fee2e2;
  --no-bd:#dc2626;
  --no-txt:#991b1b;
  --gold:#fbbf24;
  --gold-lt:#fef3c7;
  --gold-dk:#92400e;
  --txt:#141824;
  --mut:#526077;
  --bd:#141824;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:500;color:var(--txt);background:var(--bg);min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:0 16px 108px;min-height:100dvh}
.ttl,.btn,.kj{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;gap:8px}
.row{display:flex;align-items:center;gap:10px}.bt{justify-content:space-between}

/* Organic Japanese-Pop Cards: Soft Asymmetric Pebble Corners + Crisp Ink Border + Hard Offset Depth */
.pn{background:var(--card);border:2.5px solid var(--ink);border-radius:26px 14px 24px 16px;box-shadow:0 5px 0 var(--ink);padding:18px;margin-bottom:18px}
.hero{background:linear-gradient(155deg,#1d4ed8,#173ba8 58%,#091a5e);color:#fff}
.hero .mut{color:#dbeafe}
.hero-cy{background:linear-gradient(155deg,#0284c7,#0369a1 60%,#0c4a6e);color:#fff}
.hero-cy .mut{color:#e0f2fe}
.sthero{background:radial-gradient(ellipse at 50% 8%,#1e4fd6,#11329c 58%,#06134a);color:#fff}
.sthero .mut{color:#dbeafe}

/* Skewed Ribbon Badges & Tags */
.tag{display:inline-flex;align-items:center;gap:5px;background:#e0f2fe;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:3px 11px;font-weight:800;font-style:italic;font-size:.7rem;letter-spacing:.02em;margin-bottom:6px;transform:skewX(-10deg)}
.tag > *{transform:skewX(10deg)}
.tag.bl{background:var(--bl);color:#fff}
.tag.cy{background:#7dd3fc;color:var(--ink)}
.tag.ok{background:#bbf7d0;color:#14532d}
.tag.no{background:var(--no);color:var(--no-txt)}
.tag.gold{background:var(--gold-lt);color:var(--gold-dk)}

/* Tactile Buttons: Organic Pebble Shape + Crisp Border + Hard Offset Shadow */
.btn{font-size:.84rem;background:var(--bl);color:#fff;border:2.5px solid var(--ink);border-radius:18px 10px 16px 12px;padding:12px 18px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.yl{background:#4cc9f0;color:var(--ink)}
.btn.cy{background:var(--cy);color:var(--ink)}
.btn.gh{background:var(--card);color:var(--ink)}
.btn.w{width:100%}.btn.sm{padding:7px 12px;font-size:.72rem;border-radius:12px 8px 11px 9px;box-shadow:0 2.5px 0 var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mut{color:var(--mut);font-size:.8rem;line-height:1.42}

/* Organic Japanese Kanji Stamp Tile */
.kj{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:1.25rem;background:#38bdf8;color:var(--ink);border:2.5px solid var(--ink);border-radius:18px 11px 16px 12px;box-shadow:0 3px 0 var(--ink)}
.kj.off{background:var(--soft);color:var(--mut);box-shadow:none}

/* 3-Column Stat Cards */
.st{text-align:center;padding:12px 6px;border:2.5px solid var(--ink);border-radius:18px 10px 16px 12px;background:var(--card);box-shadow:0 4px 0 var(--ink)}.st strong{display:block;font-size:1.05rem;font-weight:800;color:var(--txt);margin-bottom:2px}

/* Options */
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--txt);background:var(--card);border:2.5px solid var(--ink);border-radius:18px 10px 16px 12px;padding:11px 13px;margin-top:9px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,background .12s}
.opt:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.opt b{flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--soft);color:var(--ink);border:2px solid var(--ink);border-radius:50%;font-size:.78rem}
.opt.on{background:var(--bl-lt);border-color:var(--bl)}
.opt.on b{background:var(--bl);color:#fff;border-color:var(--ink)}
.opt.ok{background:var(--ok);border-color:var(--ink)}
.opt.ok b{background:var(--ok-bd);color:#fff}
.opt.no{background:var(--no);border-color:var(--ink)}
.opt.no b{background:var(--no-bd);color:#fff}
.opt:disabled{cursor:default}

.fm{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:#141824;color:#7dd3fc;border:2.5px solid var(--ink);border-radius:14px 8px 13px 9px;padding:12px;text-align:center;margin:10px 0;overflow-x:auto}

/* Inner List Items with Dashed Ink Border */
.it{padding:12px 13px;border:2px dashed var(--ink);border-radius:16px 9px 14px 10px;margin-top:10px;background:#f8fafd}
.it.ok-box{background:var(--ok);border:2px solid var(--ok-bd);color:#14532d}
.it.gold-box{background:var(--gold-lt);border:2px solid var(--ink);color:var(--gold-dk)}

/* 3-Ring Gate Mastery Tabs */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.rings button{font:inherit;font-weight:800;font-size:.7rem;padding:8px 4px;border:2.5px solid var(--ink);border-radius:16px 9px 14px 10px;background:var(--card);color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--ink)}
.rings button.on{background:var(--bl);color:#fff}
.rings button.done{background:var(--ok);color:var(--ok-txt)}

/* Signature Feature: Bongkar Konsep Interactive Slider + Boundary Discovery */
.bk-box{background:var(--card);border:2.5px solid var(--ink);border-radius:26px 14px 24px 16px;box-shadow:0 5px 0 var(--ink);padding:16px;margin-bottom:18px}
.bk-svg{width:100%;height:170px;display:block;background:#f8fafd;border:2.5px solid var(--ink);border-radius:16px 9px 14px 10px;margin:8px 0}
input[type=range].bk-sl{-webkit-appearance:none;width:100%;height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);outline:none;margin:10px 0}
input[type=range].bk-sl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--cy);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);cursor:pointer}
.bk-readout{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);color:var(--txt);border:2px solid var(--ink);border-radius:14px 8px 13px 9px;padding:7px 11px;font-weight:800;font-size:.8rem}
.bk-tasks{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.bk-task{display:flex;align-items:center;gap:7px;padding:7px 10px;border:2px dashed #94a3b8;border-radius:13px 7px 12px 8px;background:#f8fafd;font-size:.77rem;font-weight:700;transition:background .2s,border-color .2s}
.bk-task.hit{background:var(--ok);border:2px solid var(--ok-bd);color:#14532d}
.bk-aha{margin-top:9px;padding:10px 11px;border:2px solid var(--ok-bd);border-radius:13px 7px 12px 8px;background:var(--ok);color:#14532d;font-size:.8rem;line-height:1.38}
.bk-aha.lock{background:#f8fafd;border:2px dashed #94a3b8;color:var(--mut)}
.bridge-box{margin-top:9px;padding:10px 11px;border:2px solid var(--bl-bd);border-radius:13px 7px 12px 8px;background:var(--bl-lt);color:var(--txt);font-size:.79rem;line-height:1.35}
.cliff-box{margin-top:10px;padding:11px 12px;border:2px solid var(--ink);border-radius:16px 9px 14px 10px;background:var(--gold-lt);color:var(--txt);font-size:.81rem;line-height:1.38;text-align:left}

/* Diagonal Striped Pill Progress Bars */
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#38bdf8,#38bdf8 7px,#0ea5e9 7px,#0ea5e9 14px);border-radius:99px;transition:width .3s}
.bar.rk i{background:repeating-linear-gradient(-45deg,#ffd24c,#ffd24c 7px,#f59e0b 7px,#f59e0b 14px)}

/* Natural Tactile Japanese-Pop Bottom Navigation with Double-Ring Active Pill */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:2.5px solid var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{font:inherit;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;white-space:nowrap;cursor:pointer}
.nav .k{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Segoe UI',sans-serif;font-weight:700;font-size:1.22rem;width:54px;height:34px;display:grid;place-items:center;border-radius:14px 8px 13px 9px;background:transparent;color:var(--mut);border:2px solid transparent;transition:transform .1s,background .12s}
.nav .on{color:var(--ink);font-weight:800}.nav .on .k{background:var(--bl);color:#fff;border:2px solid #fff;box-shadow:0 0 0 2.5px var(--ink),0 3px 0 2px var(--ink);transform:translateY(-2px)}

.ov{position:fixed;inset:0;z-index:50;background:rgba(20,24,36,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ov .pn{width:100%;max-width:410px;margin:0}
.reward-card{background:linear-gradient(180deg,#fffbeb,var(--card) 55%);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink)}

/* RPG Adventure Map HUD */
#mapwrap{position:fixed;inset:0;z-index:5;background:#1a2a1e;overflow:hidden}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:4;pointer-events:none}
.plate{background:var(--card);border:2.5px solid var(--ink);border-radius:16px 9px 14px 10px;padding:7px 11px;font-family:'Dela Gothic One',sans-serif;font-size:.64rem;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap;pointer-events:auto}
.hud-bar #plt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.hud-bar .mbtn{flex:none;font-size:.66rem;background:var(--cy);color:var(--ink)}
.win{position:absolute;left:10px;right:10px;top:calc(52px + env(safe-area-inset-top,0px));background:var(--card);border:2.5px solid var(--ink);border-radius:20px 11px 18px 12px;padding:11px 14px;box-shadow:0 4px 0 var(--ink);color:var(--txt);font-weight:700;font-size:.82rem;min-height:66px;cursor:pointer}
.win b{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:var(--bl)}
.win u{color:var(--bl);text-decoration-thickness:2px}
.joy{position:absolute;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.12) 65%);border:2.5px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.3);touch-action:none;user-select:none;-webkit-user-select:none}
.joy::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf8,#ffd24c 55%,#e0a820);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none}
.abtn{position:absolute;right:20px;bottom:calc(108px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;font-family:'Dela Gothic One',sans-serif;font-size:1.55rem;background:#64748b;color:#fff;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);opacity:.9;touch-action:none;cursor:pointer}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.abtn.on{background:var(--yl);color:var(--ink);opacity:1;animation:pls 1s infinite}
@keyframes pls{50%{filter:brightness(1.08)}}
.note{position:absolute;left:50%;transform:translateX(-50%);top:calc(142px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff;border:2px solid var(--yl);border-radius:99px;padding:6px 14px;font-weight:800;font-size:.76rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.note.on{opacity:1}
.note.xp{background:var(--ok);color:#14532d;border-color:var(--ink)}
.note.gold{background:var(--yl);color:var(--ink);border-color:var(--ink)}

/* Cerdas Cermat TV Studio — ORIGINAL COLORS RESTORED */
#stu{position:fixed;inset:0;z-index:5;overflow:hidden;background:#040828;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#stu .scr{position:absolute;display:flex;flex-direction:column;background:linear-gradient(#fffdf8,#f7f3e8);border:3px solid #7fc0ff;border-radius:16px;box-shadow:0 0 0 2px #0e2b96,0 0 34px rgba(70,150,255,.85);overflow:hidden}
#stu .sh{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#0a2a96,#1749cf,#0a2a96);color:#fff;padding:0 12px;height:15%;min-height:30px;font-weight:700;font-size:clamp(.78rem,2.2vw,1.05rem)}
#stu .sq{flex:1;margin:8px 10px 6px;border:1.5px solid #9fb8e8;border-radius:14px;background:#fffdf8;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 10px;color:#0f1d45;font-weight:700;font-size:clamp(.82rem,2.6vw,1.15rem)}
#stu .so{display:grid;grid-template-rows:repeat(2,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:0 10px 10px}
#stu .so button{font:inherit;font-weight:700;font-size:clamp(.78rem,2.3vw,1rem);color:#0f1d45;background:#fffdf8;border:2px solid #9fb8e8;border-radius:14px;padding:7px 12px;text-align:left;cursor:pointer}
#stu .so button.ok{background:var(--ok);border-color:var(--ok-bd);color:#14532d}#stu .so button.no{background:var(--no);border-color:var(--no-bd);color:#991b1b}#stu .so button.on{background:#e6f0ff;border-color:#2667ff}#stu .so button:disabled{cursor:default}
#stu .jur{position:absolute;background:rgba(6,22,80,.88);border:1.5px solid #5fb0ff;color:#dbeafe;border-radius:12px;padding:6px 10px;font-size:.74rem;font-weight:600;text-align:center;box-shadow:0 0 14px rgba(60,140,255,.5)}
#stu .sb{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:4px}
#stu .sb svg{width:42%;height:auto}
#stu .sb .pl{width:100%;background:linear-gradient(#0a2a82,#061b5e);border:1.5px solid #6fb4ff;border-radius:10px;text-align:center;color:#fff;padding:2px 0 3px;box-shadow:inset 0 0 8px rgba(80,160,255,.45)}
.pl small{display:block;font-size:.55rem;letter-spacing:.08em;color:#bcd6ff;font-weight:700}.pl b{display:block;font-size:1.55rem;line-height:1.05}.pl i{display:block;font-style:normal;font-size:.58rem;color:#8fb8ff}
#stu .sb.act .pl{border-color:#ffd84d;box-shadow:0 0 18px rgba(255,216,77,.95)}
#stu .dome{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.dome i{display:block;width:100%;height:100%;border-radius:50% 50% 14% 14%/90% 90% 14% 14%;background:radial-gradient(circle at 36% 26%,#ff9e9e,#ff2438 45%,#b0081c 82%,#66020e);border:2px solid #ffb8b8;box-shadow:0 0 28px rgba(255,40,60,.95),inset 0 4px 8px rgba(255,255,255,.5);transition:transform .08s}
.dome:active:not(:disabled) i{transform:translateY(5px) scale(.97)}
.dome:disabled i{filter:grayscale(.9) brightness(.55);box-shadow:none}
.dome.go i{animation:domep 1s infinite}
@keyframes domep{50%{transform:scale(1.06)}}
#stu .plab{position:absolute;transform:translateX(-50%);color:#fff;font-weight:800;letter-spacing:.12em;text-shadow:0 0 12px #3b8bff,0 0 22px #3b8bff;font-size:.78rem;white-space:nowrap}
#stu .stx{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:3;width:34px;height:34px;border-radius:50%;border:1.5px solid #7fc0ff;background:rgba(6,22,80,.82);color:#fff;font-size:1rem;cursor:pointer}
#stu .res{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(88%,380px);background:var(--card);border:2.5px solid var(--ink);border-radius:26px 14px 24px 16px;padding:18px;text-align:center;color:var(--txt);box-shadow:0 6px 0 var(--ink),0 14px 36px rgba(4,8,40,.65)}
.diag{margin-top:10px;padding:9px 11px;background:var(--no);border:2px solid var(--no-bd);color:var(--no-txt);border-radius:14px 8px 13px 9px;font-size:.8rem;line-height:1.35}
.diag-ok{margin-top:10px;padding:9px 11px;background:var(--ok);border:2px solid var(--ok-bd);color:var(--ok-txt);border-radius:14px 8px 13px 9px;font-size:.8rem;line-height:1.35}
.seal-box{margin-top:10px;padding:9px 11px;background:var(--bl-lt);border:2px solid var(--bl-bd);border-radius:14px 8px 13px 9px;font-size:.8rem;line-height:1.35;color:var(--txt)}
.seal-box.boss-win{background:var(--gold-lt);border:2px solid var(--gold);color:var(--gold-dk)}
.nav.ex{background:rgba(8,20,90,.94);border-top-color:#5fb0ff}.nav.ex button{color:#cfe0ff}.nav.ex .k{background:rgba(255,255,255,.14);color:#fff;border-color:#7fc0ff}.nav.ex .on{color:#ffd84d}.nav.ex .on .k{background:#ffd84d;color:#08145a;border-color:#fff;box-shadow:0 0 0 2px #08145a,0 3px 0 2px #08145a}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="top"></header>
  <main id="main"></main>
  <nav id="nav" class="nav"></nav>
</div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);

/* ============================================================================
   1. ORTHOGONAL PROGRESSION:
      • EFFORT (XP -> PERMANENT LEVEL, NEVER DECAYS)
      • ARENA PROGRESSION (RP -> +60 RP MATCH PROGRESSION)
   ============================================================================ */
const XP_PER_LEVEL = 120;
const FIXED_RP_GAIN = 60;
function getLevel(xp) {
  const safeXp = Math.max(0, xp || 0);
  const lv = Math.floor(safeXp / XP_PER_LEVEL) + 1;
  const curMin = (lv - 1) * XP_PER_LEVEL;
  const nextMin = lv * XP_PER_LEVEL;
  const pct = Math.min(100, Math.round(((safeXp - curMin) / XP_PER_LEVEL) * 100));
  return { lv, curMin, nextMin, pct };
}

const RANKS = [
  { name: 'Perunggu', min: 0 },
  { name: 'Perak', min: 100 },
  { name: 'Emas', min: 220 },
  { name: 'Pendekar Konsep', min: 360 },
  { name: 'Grandmaster Konsep', min: 520 }
];
function getRank(w) {
  const duels = (w && w.duel) || [];
  const rp = Math.max(0, (w && w.rp) || 0);
  if (duels.length === 0) {
    return { idx: -1, placed: false, name: 'Belum Peringkat', rp: 0, nextName: 'Perunggu', nextMin: 1, pct: 0 };
  }
  let idx = 0;
  for (let i = 0; i < RANKS.length; i++) if (rp >= RANKS[i].min) idx = i;
  const cur = RANKS[idx], nxt = RANKS[idx + 1] || null;
  const pct = nxt ? Math.min(100, Math.round(((rp - cur.min) / (nxt.min - cur.min)) * 100)) : 100;
  return { idx, placed: true, name: cur.name, rp, nextName: nxt ? nxt.name : 'Maksimal', nextMin: nxt ? nxt.min : rp, pct };
}

/* ============================================================================
   2. 4 GATE REGIONS + "BONGKAR KONSEP" + SYNTHESIS & CLIFFHANGERS
   ============================================================================ */
const LS = [
  {
    id: 'bil',
    n: 'Lembah Bilangan',
    c: 'BIL-01',
    topic: 'Teori Bilangan',
    t: 'Pola Sisa Pembagian Pangkat',

function startQuickReview() {
  const maxUnlocked = Math.max(0, dc());
  const unlockedLessons = LS.slice(0, Math.min(LS.length, maxUnlocked + 1));
  const pool = unlockedLessons.flatMap(l => l.drills.map(d => ({ topic: l.topic, q: d })));
  S.quick = { qs: shuf(pool).slice(0, 4), a: {}, done: false, repaired: false };
  render(); window.scrollTo(0, 0);
}

  const qr = S.quick;

  $('#main').innerHTML = `
    <div class='row bt' style='margin-bottom:10px'>

function subQuickReview() {
  const qr = S.quick; qr.done = true;
  const ok = qr.qs.filter((item, i) => qr.a[i] === item.q[2]).length;
  const sc = Math.round((ok / qr.qs.length) * 100);
  S.w.prac.unshift(['Latihan Kilat', qr.qs.length, ok, sc]);
  qr.repaired = getShields() < 3;
  S.w.shields = 3;
  S.w.brokenGate = null;
  const gx = 20 + ok * 15;
  gain(gx, 0); act('Latihan Kilat', `${sc}% • Perisai 3/3 🛡️`);
  plog(`${S.user.name} menyelesaikan Latihan Kilat (${sc}%)`);
  ign(); render();
}

function switchRing(r) { S.ring = r; render(); window.scrollTo(0, 0); }

function buildBongkarVisual(l, rawVal) {
  const bk = l.bongkar, v = Number(rawVal);
  let readout = '', svg = '';
  if (bk.type === 'mod') {
    const val = Math.pow(2, v), rem = val % 5;
    readout = `<span>2<sup>${v}</sup> = ${val}</span><span>Sisa bagi 5 = <b style='color:#2563eb'>${rem}</b></span>`;
    const cx = 160, cy = 85, rad = 55;
    const pts = [0, 1, 2, 3, 4].map(k => { const ang = -Math.PI / 2 + (k / 5) * Math.PI * 2; return { k, x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad }; });
    const ap = pts[rem];
    svg = `<svg class='bk-svg' viewBox='0 0 320 170'>
      <circle cx='${cx}' cy='${cy}' r='${rad}' fill='#f8fafc' stroke='#94a3b8' stroke-width='2' stroke-dasharray='5 4'/>
      <line x1='${cx}' y1='${cy}' x2='${ap.x}' y2='${ap.y}' stroke='#2563eb' stroke-width='4' stroke-linecap='round'/>
      <circle cx='${cx}' cy='${cy}' r='6' fill='#141824'/>
      ${pts.map(p => `<g><circle cx='${p.x}' cy='${p.y}' r='${p.k === rem ? 17 : 13}' fill='${p.k === rem ? '#38bdf8' : '#ffffff'}' stroke='#141824' stroke-width='2'/><text x='${p.x}' y='${p.y + 4}' text-anchor='middle' font-size='12' font-weight='800' fill='#141824'>${p.k}</text></g>`).join('')}
      <text x='160' y='162' text-anchor='middle' font-size='10.5' font-weight='700' fill='#4b5563'>Roda Sisa Modulo 5 (Siklus: 2 → 4 → 3 → 1)</text>
    </svg>`;
  } else if (bk.type === 'para') {
    const D = 16 - 4 * v;
    const rTxt = D > 0 ? '2 Titik Potong (D > 0)' : D === 0 ? '1 Titik Singgung (D = 0)' : 'Melayang (D < 0)';
    readout = `<span>c = ${v} • D = ${D}</span><span><b style='color:#2563eb'>${rTxt}</b></span>`;
    const mapX = x => 30 + ((x + 1) / 6) * 260, mapY = y => 142 - ((y + 4) / 9) * 122, yAxis = mapY(0);
    let pathD = '';
    for (let x = -0.8; x <= 4.81; x += 0.2) { const y = x * x - 4 * x + v; pathD += (pathD ? ' L ' : 'M ') + mapX(x).toFixed(1) + ' ' + Math.max(10, Math.min(160, mapY(y))).toFixed(1); }
    let dots = '';
    if (D > 0) { const r1 = 2 - Math.sqrt(D) / 2, r2 = 2 + Math.sqrt(D) / 2; dots = `<circle cx='${mapX(r1)}' cy='${yAxis}' r='6' fill='#2563eb' stroke='#141824' stroke-width='2'/><circle cx='${mapX(r2)}' cy='${yAxis}' r='6' fill='#2563eb' stroke='#141824' stroke-width='2'/>`; }
    else if (D === 0) dots = `<circle cx='${mapX(2)}' cy='${yAxis}' r='7' fill='#38bdf8' stroke='#141824' stroke-width='2'/>`;
    svg = `<svg class='bk-svg' viewBox='0 0 320 170'>
      <line x1='20' y1='${yAxis}' x2='300' y2='${yAxis}' stroke='#64748b' stroke-width='1.8' stroke-dasharray='4 3'/>
      <text x='296' y='${yAxis - 5}' text-anchor='end' font-size='10' font-weight='800' fill='#4b5563'>Sumbu-X (y=0)</text>
      <path d='${pathD}' fill='none' stroke='#2563eb' stroke-width='3.5' stroke-linecap='round'/>${dots}
      <text x='160' y='162' text-anchor='middle' font-size='10.5' font-weight='700' fill='#4b5563'>f(x) = x² − 4x + ${v}</text>
    </svg>`;
  } else if (bk.type === 'pyth') {
    const b = 4, c = Math.hypot(v, b), cTxt = Number.isInteger(c) ? c : c.toFixed(2);
    readout = `<span>a = ${v}, b = ${b}</span><span>c = √(${v*v}+${b*b}) = <b style='color:#2563eb'>${cTxt}</b></span>`;
    const x0 = 110, y0 = 125, sc = 13, x1 = x0 + v * sc, y1 = y0 - b * sc;
    svg = `<svg class='bk-svg' viewBox='0 0 320 170'>
      <polygon points='${x0},${y0} ${x1},${y0} ${x0},${y1}' fill='#eff6ff' stroke='#141824' stroke-width='2.5'/>
      <rect x='${x0}' y='${y0 - 10}' width='10' height='10' fill='none' stroke='#141824' stroke-width='1.8'/>
      <text x='${(x0 + x1) / 2}' y='${y0 + 15}' text-anchor='middle' font-size='11' font-weight='800' fill='#141824'>a = ${v}</text>
      <text x='${x0 - 8}' y='${(y0 + y1) / 2}' text-anchor='end' font-size='11' font-weight='800' fill='#141824'>b = ${b}</text>
      <text x='${(x0 + x1) / 2 + 12}' y='${(y0 + y1) / 2 - 4}' font-size='11' font-weight='800' fill='#2563eb'>c = ${cTxt}</text>
      <text x='160' y='162' text-anchor='middle' font-size='10.5' font-weight='700' fill='#4b5563'>a² + b² = ${v*v + b*b} = c²</text>
    </svg>`;
  } else {
    const xVal = v / 100, isHole = v === 200, yVal = isHole ? '0/0 (Berlubang)' : (xVal + 2).toFixed(2);
    readout = `<span>x = ${xVal.toFixed(2)}</span><span>f(x) = <b style='color:#2563eb'>${yVal}</b></span>`;
    const mapX = x => 40 + ((x - 1.4) / 1.2) * 240, mapY = y => 138 - ((y - 3.2) / 1.6) * 112;
    const hx = mapX(2), hy = mapY(4), px = mapX(xVal), py = mapY(xVal + 2);
    svg = `<svg class='bk-svg' viewBox='0 0 320 170'>
      <line x1='${mapX(1.5)}' y1='${mapY(3.5)}' x2='${mapX(2.5)}' y2='${mapY(4.5)}' stroke='#2563eb' stroke-width='3.5'/>
      <circle cx='${hx}' cy='${hy}' r='7' fill='#ffffff' stroke='#141824' stroke-width='2.5'/>
      <circle cx='${px}' cy='${py}' r='7' fill='${isHole ? '#ef4444' : '#38bdf8'}' stroke='#141824' stroke-width='2'/>
      <text x='${hx}' y='${hy - 12}' text-anchor='middle' font-size='10' font-weight='800' fill='#141824'>Lubang (2, 4)</text>
      <text x='160' y='162' text-anchor='middle' font-size='10.5' font-weight='700' fill='#4b5563'>Geser x mendekati 2,00</text>
    </svg>`;
  }
  return { svg, readout };
}

function submitRing3() {
  const l = LS.find(x => x.id === S.les); S.ds = true;
  const ok = l.drills.filter((q, i) => S.da[i] === q[2]).length;
  const acc = Math.round((ok / l.drills.length) * 100);
  const firstMastery = (S.w.nodes[l.id] || 0) < 3;
  const wasBroken = getShields() < 3;
  S.w.nodes[l.id] = 3;
  S.w.done[l.id] = { sc: acc };
  S.w.prac.unshift([l.topic, l.drills.length, ok, acc]);
  S.w.shields = 3;
  S.w.brokenGate = null;
  const gx = firstMastery ? 90 : 25;

  act(`${l.n} Selesai`, `Akurasi ${acc}% (+${gx} XP)`);
  plog(`${S.user.name} menuntaskan ${l.n} (${acc}%)`);
  if (dc() === LS.length) badge('peta');
  render();
  if (firstMastery) {
    cele(
      l.boss ? '👑 Boss ' + l.n + ' Ditaklukkan!' : l.n + ' Selesai!',
      `Akurasi ${acc}% • +${gx} XP • ${l.topic} terbuka di Arena.`,
      null,
      `<div class='cliff-box'>${l.cliffhanger}</div>`,
      !!l.boss

}

        <div class='row bt'>
          <h2 class='ttl' style='font-size:1.05rem'>Riwayat Duel</h2>
          <span class='mut' style='font-weight:800'>${s.dw}W / ${s.dn}M</span>
        </div>
        ${S.w.duel.map(du => {
          const dRp = du.rpDelta !== undefined ? ` <span class='mut'>+${Math.abs(du.rpDelta)} RP</span>` : '';
          return `<div class='it row bt'><span><span class='tag ${du.o === 'Menang' ? 'ok' : ''}' style='margin:0'><span>${du.o === 'Menang' ? '✅ ' : ''}${du.o}</span></span> vs ${du.on}${dRp}</span><b>${du.us} - ${du.os}</b></div>`;
        }).join('') || "<div class='it mut'>Belum ada duel.</div>"}
      </section>`;
    return;
  }
  studio(m, u);
}

function startD() {
  const sh = getShields(), d = dc();
  if (d < 1 || sh <= 0) { render(); return; }
  if (S.du) exitDuel();
  const pool = LS.slice(0, d)
    .flatMap(l => l.drills.map(q => ({ gateId: l.id, topic: l.topic, q })));
  S.du = {
    on: S.user.g === 'Laki-laki' ? 'Raka Pratama' : 'Alya Putri',
    qs: shuf(pool).slice(0, 4),
    i: 0, us: 0, os: 0, uSh: sh, oSh: 3, t: 20,
    brokenGate: null, rpDelta: 0, clean: false,
    ph: 'buzz', msg: 'Pahami soal sebelum menekan Tombol!',
    ch: null, el: null, tm: 0, iv: 0, done: false
  };
  roundStart(); render();
}
function resetDuelTimer(sec) {
  const m = S.du; if (!m) return;
  m.t = sec;
  const el = document.getElementById('dtm');
  if (el) el.textContent = '00:' + String(Math.max(0, m.t)).padStart(2, '0');
  clearInterval(m.iv);
  m.iv = setInterval(tickDuel, 1000);
}
function crackPlayerShield(m, gateId) {
  m.uSh = Math.max(0, m.uSh - 1);
  m.brokenGate = gateId;
  S.w.shields = m.uSh;
  S.w.brokenGate = gateId;
}
function tickDuel() {
  const m = S.du; if (!m || m.done) return;
  if (m.t > 0) m.t--;
  const el = document.getElementById('dtm');
  if (el) el.textContent = '00:' + String(Math.max(0, m.t)).padStart(2, '0');
  if (m.t > 0) return;
  const item = m.qs[m.i], q = item.q;
  if (m.ph === 'buzz') {
    reveal('Waktu tombol habis!', q[2]);
  } else if (m.ph === 'me') {
    m.us -= 50; crackPlayerShield(m, item.gateId);
    m.msg = 'Waktu habis! −50 & −1 🛡️. Dilempar ke lawan.';
    m.ph = 'rbop'; resetDuelTimer(4); render();
    clearTimeout(m.tm);
    m.tm = setTimeout(() => {
      if (S.du !== m || m.ph !== 'rbop') return;
      if (Math.random() < .5) { m.os += 100; reveal(m.on + ' benar (+100).', q[2]); }
      else reveal('Lawan juga meleset.', q[2]);
    }, 1500);
  } else if (m.ph === 'rbme') {
    reveal('Waktu lemparan habis.', q[2]);
  } else if (m.ph === 'rev') {
    nextD();
  }
}
function roundStart() {
  const m = S.du; if (!m) return;
  clearTimeout(m.tm); m.ph = 'buzz'; m.el = null; m.ch = null;
  resetDuelTimer(20);
  const delay = 3000 + Math.random() * 5500;
  m.tm = setTimeout(oppBuzz, delay);
}
function oppBuzz() {
  const m = S.du; if (!m || m.ph !== 'buzz' || m.oSh <= 0) return;
  const q = m.qs[m.i].q;
  clearTimeout(m.tm); m.ph = 'opp'; m.msg = m.on + ' menekan tombol!'; resetDuelTimer(4); render();
  m.tm = setTimeout(() => {
    if (S.du !== m || m.ph !== 'opp') return;
    if (Math.random() < .52) { m.os += 100; reveal(m.on + ' benar (+100).', q[2]); }
    else {
      m.os -= 50; m.oSh = Math.max(0, m.oSh - 1); m.ph = 'rbme'; m.el = null;
      m.msg = `${m.on} salah (−50)! Soal lemparan.`;
      resetDuelTimer(9); render();
    }
  }, 1300);
}
function buzz() {
  const m = S.du; if (!m || m.ph !== 'buzz' || m.uSh <= 0) return;
  clearTimeout(m.tm); m.ph = 'me'; m.msg = 'Pilih jawaban (+100 benar, −50 & −1 🛡️ jika salah).';
  resetDuelTimer(12); render();
}
function ans(i) {
  const m = S.du; if (!m) return;
  const item = m.qs[m.i], q = item.q;
  clearTimeout(m.tm);
  if (m.ph === 'me') {
    if (i === q[2]) { m.us += 100; reveal('Tepat! +100.', q[2], i); }
    else {
      m.us -= 50; crackPlayerShield(m, item.gateId); m.el = i; m.ph = 'rbop';
      m.msg = 'Kurang tepat! −50 & −1 🛡️. Lemparan ke lawan…';
      resetDuelTimer(4); render();
      m.tm = setTimeout(() => {
        if (S.du !== m || m.ph !== 'rbop') return;
        if (Math.random() < .5) { m.os += 100; reveal(m.on + ' benar (+100).', q[2], i); }
        else reveal('Lawan juga meleset.', q[2], i);
      }, 1500);
    }
  } else if (m.ph === 'rbme') {
    if (i === q[2]) { m.us += 100; reveal('Lemparan tepat! +100.', q[2], i); }
    else reveal('Kurang tepat, skor tetap aman.', q[2], i);
  }
}
function pass() { const m = S.du; if (!m || m.ph !== 'rbme') return; clearTimeout(m.tm); reveal('Lemparan dilewati.', m.qs[m.i].q[2]); }
function reveal(msg, ci, ch) {
  const m = S.du; if (!m || m.done) return;
  clearTimeout(m.tm); m.ph = 'rev'; m.ch = ch == null ? null : ch; m.msg = msg + ' Kunci: ' + 'ABCD'[ci] + '.';
  resetDuelTimer(2); render();
}
function nextD() {
  const m = S.du; if (!m) return;
  if (m.i + 1 < m.qs.length) { m.i++; roundStart(); render(); return; }
  m.o = m.us > m.os ? 'Menang' : m.us === m.os ? 'Seri' : 'Kalah'; m.done = true; clearInterval(m.iv);

  m.clean = m.uSh === 3;
  m.rpDelta = FIXED_RP_GAIN;
  S.w.rp = Math.max(0, (S.w.rp || 0) + FIXED_RP_GAIN);

  S.w.duel.unshift({ o: m.o, on: m.on, us: m.us, os: m.os, rpDelta: m.rpDelta, clean: m.clean });
  act('Duel vs ' + m.on, `${m.o} (${m.us}-${m.os}) • +${m.rpDelta} RP`);
  const gx = m.o === 'Menang' ? 120 : 25; gain(gx, 0);
  if (m.o === 'Menang') badge('duel');
  ign(); render();
}
function exitDuel() { if (S.du) { clearTimeout(S.du.tm); clearInterval(S.du.iv); S.du = null; } }

/* ============================================================================
   8. TAB 3: SAYA
   ============================================================================ */
function tabProfil() {
  const s = stats(), u = S.user, lv = getLevel(S.w.xp), rk = getRank(S.w), p = S.w.pair, sl = Math.min(getSeals(), REQUIRED_SEALS);
  const duoCard = !p.on ? `
    <section class='pn hero-cy'>
      <span class='tag cy' style='margin:0'><span>TEMAN BELAJAR</span></span>
      <h2 class='ttl' style='font-size:1.05rem;margin-top:8px'>Streak Harian Berdua</h2>
      <p style='font-size:.8rem;font-weight:700;margin:4px 0 10px;color:#e0f2fe'>Belajar konsisten bersama partner ${u.g}.</p>
      <button class='btn yl w' onclick='S.w.pair.on=true;S.w.pair.pn=S.user.g==="Laki-laki"?"Raka Pratama":"Siti Rahma";S.w.pair.streak=Math.max(1,S.w.pair.streak);S.w.pair.days[0]=1;S.w.pair.logs=[S.w.pair.pn+" menuntaskan Lembah Bilangan"];act("Terhubung dengan "+S.w.pair.pn,"Teman Belajar");render()'>Hubungkan Partner ▶</button>
    </section>` : `
    <section class='pn'>
      <div class='row bt'>
        <div>
          <span class='tag gold' style='margin:0'><span>🔥 ${p.streak} HARI</span></span>
          <h2 class='ttl' style='font-size:1.05rem;margin-top:6px'>${p.pn}</h2>
        </div>
        <button class='btn gh sm' onclick='S.w.pair.on=false;S.w.pair.logs=[];render()'>Putus</button>
      </div>
      <div class='row bt' style='margin:10px 0'>
        ${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((d, i) => `
          <div style='text-align:center'>
            <div class='mut' style='font-size:.7rem'>${d}</div>
            <div class='kj ${p.days[i] ? '' : 'off'}' style='width:34px;height:34px;font-size:.85rem;margin:4px auto 0;${p.days[i] ? 'background:var(--yl);color:var(--ink)' : ''}'>${p.days[i] ? '★' : '·'}</div>
          </div>`).join('')}
      </div>
      ${p.logs.map(l => `<div class='it' style='font-size:.8rem'>⚡ ${l}</div>`).join('')}
    </section>`;

  const masteryList = LS.map(l => {
    const st = S.w.nodes[l.id] || 0;
    const pct = st >= 3 ? 100 : st === 2 ? 66 : st === 1 ? 33 : 0;
    return `
      <div style='margin-top:12px'>
        <div class='row bt' style='font-size:.82rem;font-weight:800;margin-bottom:5px'>
          <span>${l.topic} (${l.n})</span>
          <span>${st}/3 Ring</span>
        </div>
        <div class='bar'><i style='width:${pct}%'></i></div>
      </div>`;
  }).join('');

  $('#main').innerHTML = `
    <section class='pn hero'>
      <div class='row'>
        <div class='kj' style='width:54px;height:54px;font-size:1.45rem;background:var(--cy);color:var(--ink)'>我</div>
        <div>
          <h1 class='ttl' style='font-size:1.15rem'>${u.name}</h1>
          <div style='font-weight:700;font-size:.8rem;color:#dbeafe'>${u.gr} • ${u.g}</div>
          <div style='margin-top:6px'>
            <span class='tag cy' style='margin:0 4px 0 0'><span>Lv.${lv.lv} • ${S.w.xp} XP</span></span>
            <span class='tag gold' style='margin:0'><span>🏆 ${rk.name}</span></span>
          </div>
        </div>
      </div>
    </section>

    <section class='pn'>
      <div class='row bt' style='margin-bottom:5px'>
        <h2 class='ttl' style='font-size:.95rem'>Level ${lv.lv}</h2>
        <span class='mut' style='font-weight:800'>${S.w.xp} / ${lv.nextMin} XP</span>
      </div>
      <div class='bar' style='margin-bottom:14px'><i style='width:${lv.pct}%'></i></div>

      <div class='row bt' style='margin-bottom:5px'>
        <h2 class='ttl' style='font-size:.95rem'>Rank ${rk.name}</h2>
        <span class='mut' style='font-weight:800'>${rk.rp} RP • +${FIXED_RP_GAIN}/duel</span>
      </div>
      <div class='bar rk'><i style='width:${rk.pct}%'></i></div>
    </section>

    ${duoCard}

    <div class='g3' style='margin-bottom:18px'>
      <div class='st'><strong>${s.d}/${LS.length}</strong><span class='mut'>Gerbang</span></div>
      <div class='st'><strong>${getShields()}/3</strong><span class='mut'>Perisai 🛡️</span></div>
      <div class='st'><strong>${sl}/${REQUIRED_SEALS}</strong><span class='mut'>Segel Kuil 🏛️</span></div>
    </div>

    <section class='pn'>
      <h2 class='ttl' style='font-size:1.05rem;line-height:1.25'>Penguasaan Konsep per Wilayah</h2>
      ${masteryList}
    </section>

    <section class='pn'>
      <h2 class='ttl' style='font-size:1.05rem;margin-bottom:8px'>Lencana Petualang</h2>
      <div>${(S.w.bd || []).map(id => `<span class='tag cy' title='${BDG[id][1]}'><span>${BDG[id][0]}</span></span> `).join('') || "<span class='mut'>Belum ada lencana.</span>"}</div>
    </section>

    <section class='pn'>
      <h2 class='ttl' style='font-size:1.05rem;margin-bottom:4px'>Riwayat Aktivitas</h2>
      ${S.w.act.slice(0, 5).map(a => `<div class='it'><b>${a[0]}</b><div class='mut'>${a[1]} • ${a[2]}</div></div>`).join('') || "<div class='it mut'>Belum ada aktivitas.</div>"}
    </section>

    <button class='btn gh w' onclick='logout()'>Keluar</button>`;
}

function logout() { saveMap(); exitDuel(); S.user = null; S.w = null; render(); }

/* ---------- KONTROL JOYSTICK & KEYBOARD ---------- */
let JP = null;
function joyMove(e) { const j = $('#joy'); if (!j) return; const r = j.getBoundingClientRect(), R = r.width / 2 - 8; let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = Math.hypot(dx, dy); if (m > R) { dx *= R / m; dy *= R / m; } JOY.x = dx / R; JOY.y = dy / R; const k = $('#knob'); if (k) k.style.transform = `translate(${dx}px,${dy}px)`; }
function joyEnd() { JP = null; JOY.x = JOY.y = 0; const k = $('#knob'); if (k) k.style.transform = 'translate(0,0)'; }
document.addEventListener('pointerdown', e => { if (JP === null && e.target.closest && e.target.closest('#joy')) { JP = e.pointerId; e.preventDefault(); joyMove(e); } });
document.addEventListener('pointermove', e => { if (e.pointerId === JP) joyMove(e); });
document.addEventListener('pointerup', e => { if (e.pointerId === JP) joyEnd(); });
document.addEventListener('pointercancel', e => { if (e.pointerId === JP) joyEnd(); });

const KM = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
window.addEventListener('keydown', e => {
  const m = KM[e.key];
  if (m) { KB[m] = 1; if (e.key.startsWith('Arrow') && S.tab === 'belajar' && !S.les && !S.quick) e.preventDefault(); }
  if (e.key === 'e' || e.key === 'E' || e.key === 'Enter' || e.key === ' ') { if (mapActive()) mapTap(); }
});
window.addEventListener('keyup', e => { const m = KM[e.key]; if (m) KB[m] = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { joyEnd(); KB.u = KB.d = KB.l = KB.r = 0; saveMap(); } });
window.addEventListener('resize', () => { if (S.user && S.tab === 'duel' && S.du && !S.du.done) render(); });

render();
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rascademy — Petualangan Konsep Matematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14214d;
  --card:#fafdff;
  --soft:#e7f2ff;
  --pk:#2563eb;
  --bl:#2563eb;
  --yl:#ffc83d;
  --cy:#1fb5e6;
  --txt:#14214d;
  --mut:#52648c;
  --sh:#14214d;
  --ok:#8ef0bf;
  --ok-bd:#16a34a;
  --ok-txt:#14532d;
  --no:#ffa3b5;
  --no-bd:#dc2626;
  --no-txt:#881337;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:500;color:var(--txt);background:linear-gradient(165deg,#d6ecff 0%,#eaf5ff 48%,#d2f2ff 100%) fixed;min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:0 14px 104px;min-height:100dvh}
.ttl,.btn,.kj{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:8px}
.row{display:flex;align-items:center;gap:10px}.bt{justify-content:space-between}

.pn{background:var(--card);border:2.5px solid var(--ink);border-radius:6px 20px 6px 20px;box-shadow:5px 5px 0 var(--sh);padding:14px;margin-bottom:16px}
.hero{background:linear-gradient(125deg,#1d4ed8 0%,#2563eb 52%,#0ea5e9 100%);color:#ffffff}
.hero .mut{color:#e0f2fe;font-weight:700}
.hero-cy{background:linear-gradient(125deg,#38bdf8 0%,#7dd3fc 58%,#fde047 100%);color:#14214d}
.hero-cy .mut{color:#14214d;font-weight:700}
.sthero{background:radial-gradient(ellipse at 50% 0,#2f6bff,#0a1f7a 70%,#050a30);color:#fff;border-color:#5fb0ff;box-shadow:5px 5px 0 #050a30}
.sthero .mut{color:#cfe0ff}

.tag{display:inline-block;background:var(--yl);color:var(--ink);border:2px solid var(--ink);padding:1px 10px;font-weight:800;font-size:.72rem;transform:skew(-10deg);margin-bottom:6px}
.tag.pk{background:var(--bl);color:#fff}
.tag.cy{background:var(--cy);color:#14214d}
.tag.ok{background:var(--ok);color:#14214d}
.tag.no{background:var(--no);color:#14214d}
.tag.gold{background:var(--yl);color:#14214d}

.btn{font-size:.85rem;background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 var(--sh);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn.yl{background:linear-gradient(180deg,#ffd45e,#f5b82e);color:#14214d}
.btn.cc-yl{background:var(--yl);color:#14214d;border-color:#14214d;box-shadow:3px 3px 0 #14214d}
.btn.cy{background:linear-gradient(180deg,#38bdf8,#0ea5e9);color:#14214d}
.btn.gh{background:var(--card);color:var(--txt)}
.btn.w{width:100%}.btn.sm{padding:6px 12px;font-size:.74rem}.btn:disabled{opacity:.45;cursor:not-allowed}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mut{color:var(--mut);font-size:.8rem;line-height:1.4}

.kj{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:1.2rem;background:linear-gradient(145deg,#ffe074,#ffc83d);color:var(--ink);border:2.5px solid var(--ink);border-radius:50% 12px 50% 12px;box-shadow:3px 3px 0 var(--sh)}
.kj.off{background:var(--soft);color:var(--mut);box-shadow:none}

.st{text-align:center;padding:8px 4px;border:2px solid var(--ink);border-radius:8px;background:var(--soft)}.st strong{display:block;font-size:1rem;font-weight:800;color:var(--txt)}

.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--txt);background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;box-shadow:3px 3px 0 var(--sh);transition:transform .08s,background .12s}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.opt b{flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--yl);color:var(--ink);border:2px solid var(--ink);border-radius:50%;font-size:.78rem}
.opt.on{background:#bae6fd}.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}
.opt:disabled{cursor:default}

.fm{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:#0e1b47;color:#7fe3ff;border:2.5px solid var(--ink);border-radius:8px;padding:12px;text-align:center;margin:10px 0;overflow-x:auto}

.it{padding:10px;border:2px dashed var(--ink);border-radius:8px;margin-top:8px;background:var(--soft)}
.it.ok-box{background:var(--ok);border:2px solid var(--ink);color:var(--ink)}
.it.gold-box{background:#fff4cc;border:2px solid var(--ink);color:var(--ink)}

/* 3-Ring Gate Mastery Tabs */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.rings button{font:inherit;font-weight:800;font-size:.72rem;padding:7px 2px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:2px 2px 0 var(--sh)}
.rings button.on{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff}
.rings button.done{background:var(--ok);color:var(--ink)}

/* Bongkar Konsep Interactive Slider + Boundary Discovery */
.bk-box{background:var(--card);border:2.5px solid var(--ink);border-radius:6px 20px 6px 20px;box-shadow:5px 5px 0 var(--sh);padding:14px;margin-bottom:16px}
.bk-svg{width:100%;height:170px;display:block;background:#fff;border:2.5px solid var(--ink);border-radius:10px;margin:8px 0}
input[type=range].bk-sl{-webkit-appearance:none;width:100%;height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);outline:none;margin:10px 0}
input[type=range].bk-sl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#93c5fd,#2563eb);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--sh);cursor:pointer}
.bk-readout{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);color:var(--txt);border:2px solid var(--ink);border-radius:8px;padding:7px 11px;font-weight:800;font-size:.8rem}
.bk-tasks{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.bk-task{display:flex;align-items:center;gap:7px;padding:7px 10px;border:2px dashed var(--ink);border-radius:8px;background:var(--card);font-size:.77rem;font-weight:700;transition:background .2s}
.bk-task.hit{background:var(--ok);border:2px solid var(--ink);color:var(--ink)}
.bk-aha{margin-top:9px;padding:10px 11px;border:2px solid var(--ink);border-radius:8px;background:var(--ok);color:var(--ink);font-size:.8rem;line-height:1.38}
.bk-aha.lock{background:var(--soft);border:2px dashed var(--ink);color:var(--mut)}
.bridge-box{margin-top:9px;padding:10px 11px;border:2px solid var(--ink);border-radius:8px;background:#e0f7ff;color:var(--txt);font-size:.79rem;line-height:1.35}
.cliff-box{margin-top:10px;padding:11px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff4cc;color:var(--txt);font-size:.81rem;line-height:1.38;text-align:left}

/* Daftar Materi Lengkap */
.bab-card{border:2.5px solid var(--ink);border-radius:12px;background:var(--card);margin-top:10px;box-shadow:3px 3px 0 var(--sh);overflow:hidden}
.bab-hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--soft);border:0;text-align:left;font:inherit;color:var(--txt);cursor:pointer;transition:background .15s}
.bab-hd.open{background:linear-gradient(90deg,#ffd45e,#ffe484);border-bottom:2px solid var(--ink)}
.bab-bd{padding:10px 11px 12px;background:var(--card)}
.sub-card{border:2px solid var(--ink);border-radius:10px;margin-top:8px;background:var(--soft);overflow:hidden}
.sub-card:first-child{margin-top:0}
.sub-hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--soft);border:0;text-align:left;font:inherit;font-weight:800;font-size:.82rem;color:var(--txt);cursor:pointer;transition:background .15s}
.sub-hd.open{background:#cde7ff;border-bottom:1.5px dashed var(--ink)}
.sub-bd{padding:7px 9px 9px;background:var(--card);display:flex;flex-direction:column;gap:7px}
.ssub-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);text-align:left;font:inherit;color:var(--txt);cursor:pointer;box-shadow:2px 2px 0 var(--sh);transition:transform .08s,background .12s}
.ssub-btn:active{transform:translate(2px,2px);box-shadow:none}
.ssub-btn.watched{background:#e8fdf2}
.ssub-play{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3b82f6,#2563eb);color:#fff;border:2px solid var(--ink);font-size:.74rem;font-weight:800}
.ssub-btn.watched .ssub-play{background:var(--ok);color:var(--ink)}
.tok-pill{flex:none;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:99px;border:2px solid var(--ink);background:var(--yl);color:var(--ink);white-space:nowrap}
.tok-pill.done{background:var(--ok);color:var(--ink)}

/* Video Konsep Cinema Modal */
.vid-stage{position:relative;width:100%;border:2.5px solid var(--ink);border-radius:12px;background:#09142b;overflow:hidden;margin:8px 0}
.vid-cv{width:100%;height:178px;display:block}
.vid-sub{background:rgba(10,20,44,.94);color:#f8fafc;border-top:1.5px solid #334155;padding:8px 11px;font-size:.77rem;font-weight:700;line-height:1.35;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.vid-ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
.vid-prog{flex:1;height:12px;border:2px solid var(--ink);border-radius:99px;background:var(--soft);overflow:hidden;cursor:pointer;position:relative}
.vid-prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,#2563eb 0 8px,#38bdf8 8px 16px);border-radius:99px;transition:width .15s linear}

.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#2563eb 0 8px,#38bdf8 8px 16px);transition:width .3s}
.bar.rk i{background:repeating-linear-gradient(45deg,var(--yl) 0 8px,#ffe082 8px 16px)}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:3px solid var(--ink);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{font:inherit;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;color:#475885;font-size:.62rem;white-space:nowrap;cursor:pointer}
.nav .k{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Segoe UI',sans-serif;font-weight:400;font-size:1.3rem;width:44px;height:30px;display:grid;place-items:center;border-radius:10px;transition:background .15s,color .15s}
.nav .on{color:#14214d;font-weight:700}.nav .on .k{background:linear-gradient(145deg,#3b82f6,#2563eb);color:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--sh)}

.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,52,.72);display:flex;align-items:center;justify-content:center;padding:12px}
.ov .pn{width:100%;max-width:430px;margin:0}
.reward-card{background:linear-gradient(180deg,#fff9e6,var(--card) 55%);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--sh)}

/* Lencana Petualang */
.bdg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bdg-item{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px;border:2px solid var(--ink);border-radius:10px;background:var(--soft);box-shadow:2px 2px 0 var(--sh);cursor:pointer;transition:transform .08s}
.bdg-item:active{transform:translate(2px,2px);box-shadow:none}
.bdg-item.lock{background:var(--card);border-style:dashed;box-shadow:none;opacity:.58}
.bdg-item.lock .bdg-ico{filter:grayscale(1) contrast(.88)}
.bdg-ico{width:54px;height:58px;display:block;flex:none}
.bdg-lbl{font-size:.65rem;font-weight:800;line-height:1.2;color:var(--txt);margin-top:5px}
.bdg-sub{font-size:.58rem;font-weight:700;color:var(--ok-txt);margin-top:2px}
.bdg-item.lock .bdg-sub{color:var(--mut)}

/* Showroom Bengkel Tong Kreatif */
.room-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:linear-gradient(135deg,#fff8dc,#e0f2fe);margin-top:10px;box-shadow:3px 3px 0 var(--sh);cursor:pointer}
.sr-stage{position:relative;border:2.5px solid var(--ink);border-radius:14px;background:radial-gradient(circle at 50% 25%,#1e3a8a 0%,#0f172a 75%,#090d1f 100%);overflow:hidden;margin-top:8px}
.sr-cv{width:100%;height:192px;display:block}
.sr-hud-top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
.sr-hud-bot{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sr-chip{background:rgba(15,23,42,.86);color:#f8fafc;border:1.5px solid #60a5fa;border-radius:999px;padding:3px 9px;font-size:.66rem;font-weight:800;backdrop-filter:blur(4px)}
.sr-lock-banner{margin-top:7px;padding:7px 10px;border-radius:10px;border:2px dashed #d97706;background:#fffbeb;color:#92400e;font-size:.73rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sr-presets{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;margin-top:6px;scrollbar-width:none}
.sr-presets::-webkit-scrollbar{display:none}
.sr-pre{flex:none;font:inherit;font-size:.7rem;font-weight:800;padding:5px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--soft);color:var(--txt);cursor:pointer;white-space:nowrap;box-shadow:2px 2px 0 var(--sh)}
.sr-pre.locked{background:#f1f5f9;color:#64748b;border-style:dashed;box-shadow:none}
.sr-pre:active{transform:translate(2px,2px);box-shadow:none}
.sr-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.sr-tabs button{font:inherit;font-size:.67rem;font-weight:800;padding:7px 2px;border:2px solid var(--ink);border-radius:9px;background:var(--card);color:var(--mut);cursor:pointer;box-shadow:2px 2px 0 var(--sh);display:flex;flex-direction:column;align-items:center;gap:1px}
.sr-tabs button.on{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff}
.sr-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.sr-opt{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 9px;border:2px solid var(--ink);border-radius:11px;background:var(--card);color:var(--txt);font:inherit;cursor:pointer;box-shadow:2px 2px 0 var(--sh);transition:transform .08s,background .12s;position:relative}
.sr-opt:active{transform:translate(2px,2px);box-shadow:none}
.sr-opt.on{background:linear-gradient(180deg,#fff4cc,#fde68a);border-width:2.5px}
.sr-opt.locked{background:#f1f5f9;border-style:dashed;border-color:#94a3b8;box-shadow:none;opacity:.78}
.sr-opt.locked.prev{border-color:#f59e0b;background:#fffbeb;opacity:1}
.sr-lock-pill{display:inline-block;margin-top:3px;font-size:.6rem;font-weight:800;padding:1px 6px;border-radius:6px;background:#e2e8f0;color:#334155;border:1px solid #94a3b8}
.sr-opt.locked.prev .sr-lock-pill{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.sr-swatch{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-size:.82rem;font-weight:800}

/* Adventure Map Overlay & Cream/Azure HUD */
#mapwrap{position:fixed;inset:0;z-index:5;background:#1a2a1e;overflow:hidden}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.plate{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;background:#fff8e8;border:3px solid #14214d;border-radius:10px;padding:4px 12px;font-family:'Dela Gothic One',sans-serif;font-size:.78rem;color:#14214d;box-shadow:3px 3px 0 #14214d;z-index:6;white-space:nowrap}
.win{position:absolute;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top,0px));bottom:auto;max-width:460px;margin:0 auto;background:linear-gradient(#fffdf6,#fbeccb);border:3px solid #14214d;border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 #14214d;color:#14214d;font-weight:700;font-size:.86rem;min-height:72px;cursor:pointer;z-index:6}
.win b{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:#1d4ed8}
.scroll{background:#f4e1b4;border:3px dashed #3b2a14;color:#3b2a14;transform:rotate(-1deg)}
.joy{position:absolute;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,240,.35),rgba(255,250,240,.12) 65%);border:3px solid rgba(255,250,240,.9);box-shadow:0 0 0 3px rgba(20,33,77,.65);touch-action:none;user-select:none;-webkit-user-select:none;z-index:6}
.joy::before{content:'';position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,250,240,.5)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#bae6fd 45%,#2563eb 100%);border:3px solid #14214d;box-shadow:0 4px 0 #14214d;pointer-events:none}
.abtn{position:absolute;right:22px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;font-family:'Dela Gothic One',sans-serif;font-size:1.6rem;background:#64748b;color:#fff;border:3px solid #14214d;box-shadow:0 5px 0 #14214d;opacity:.78;touch-action:none;cursor:pointer;z-index:6}
.abtn:active{transform:translateY(4px);box-shadow:0 1px 0 #14214d}
.abtn.on{background:radial-gradient(circle at 35% 30%,#60a5fa,#2563eb);opacity:1;animation:pls 1s infinite}
@keyframes pls{50%{filter:brightness(1.18)}}
.note{position:absolute;left:50%;transform:translateX(-50%);top:calc(196px + env(safe-area-inset-top,0px));background:rgba(12,24,68,.9);color:#ffe9a8;border:2px solid #ffd45e;border-radius:12px;padding:5px 12px;font-weight:800;font-size:.78rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}.note.on{opacity:1}
.note.lv{background:#ffd45e;color:#14214d;border-color:#14214d;font-size:.9rem}.note.bd{background:#7dd3fc;color:#14214d;border-color:#14214d}.note.ac{background:#8ef0bf;color:#14214d;border-color:#14214d}
.xpb{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:6px;background:rgba(0,0,0,.4);z-index:6}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ffd45e,#fff3a8);box-shadow:0 0 8px #ffd45e;transition:width .7s}
.xpb.fl{filter:brightness(1.6) drop-shadow(0 0 6px #ffd45e)}

/* ============================================================================
   CERDAS CERMAT TV STUDIO — NEON QUIZ ARENA DESIGN
   ============================================================================ */
#stu{position:fixed;inset:0;z-index:5;overflow:hidden;background:#030826;font-family:'M PLUS Rounded 1c',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#stu .scr{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,#f5f8ff,#e4ecff);border:3px solid #a8cbff;border-radius:16px;box-shadow:0 0 0 2px #0f32a3,0 0 34px rgba(72,162,255,.92);overflow:hidden;z-index:2}
#stu .sh{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#0b2d96,#1749cf 50%,#0b2d96);color:#fff;padding:0 14px;height:36px;flex:none;font-weight:800;font-size:clamp(.82rem,2.4vw,1.02rem);letter-spacing:.01em}
#stu .sh-l,#stu .sh-r{display:flex;align-items:center;gap:7px}

/* ============================================================================
   1. ORTHOGONAL PROGRESSION
   ============================================================================ */
const XP_PER_LEVEL = 120;
const FIXED_RP_GAIN = 60;
const FIXED_DUEL_XP = 150;
function getLevel(xp) {
  const safeXp = Math.max(0, xp || 0);
  const lv = Math.floor(safeXp / XP_PER_LEVEL) + 1;
  const curMin = (lv - 1) * XP_PER_LEVEL;
  const nextMin = lv * XP_PER_LEVEL;
  const pct = Math.min(100, Math.round(((safeXp - curMin) / XP_PER_LEVEL) * 100));
  return { lv, curMin, nextMin, pct };
}

const RANKS = [
  { name: 'Perunggu', min: 0 },
  { name: 'Perak', min: 100 },
  { name: 'Emas', min: 220 },
  { name: 'Pendekar Konsep', min: 360 },
  { name: 'Grandmaster Konsep', min: 520 }
];
function getRank(w) {
  const duels = (w && w.duel) || [];
  const rp = Math.max(0, (w && w.rp) || 0);
  if (duels.length === 0) {
    return { idx: -1, placed: false, name: 'Belum Peringkat', rp: 0, nextName: 'Perunggu', nextMin: 1, pct: 0 };
  }
  let idx = 0;
  for (let i = 0; i < RANKS.length; i++) if (rp >= RANKS[i].min) idx = i;
  const cur = RANKS[idx], nxt = RANKS[idx + 1] || null;
  const pct = nxt ? Math.min(100, Math.round(((rp - cur.min) / (nxt.min - cur.min)) * 100)) : 100;
  return { idx, placed: true, name: cur.name, rp, nextName: nxt ? nxt.name : 'Maksimal', nextMin: nxt ? nxt.min : rp, pct };
}

function checkReqUnlock(req) {
  if (!req || (!req.gate && !req.lv)) return { ok: true, label: 'Terbuka' };
  const gatesDone = dc();
  const lvNow = S.w ? getLevel(S.w.xp).lv : 1;
  const parts = [];
  let ok = true;
  if (req.gate) {
    if (gatesDone < req.gate) ok = false;
    parts.push(`Gerbang ${req.gate}`);
  }
  if (req.lv) {
    if (lvNow < req.lv) ok = false;
    parts.push(`Lv.${req.lv}`);
  }
  return { ok, label: ok ? 'Terbuka' : parts.join(' & ') };
}

function getCatalogForTab(tab) {
  if (tab === 'body') return TONG_BODIES;
  if (tab === 'size') return TONG_SIZES;
  if (tab === 'wheel') return TONG_WHEELS;
  if (tab === 'color') return TONG_COLORS;
  if (tab === 'topper') return TONG_TOPPERS;
  return TRL;
}

function isTongPartUnlocked(tab, key) {
  const cat = getCatalogForTab(tab);
  const item = cat && cat[key];
  return checkReqUnlock(item && item.req);
}

function isPresetUnlocked(cfg) {
  const checks = [
    isTongPartUnlocked('size', cfg.size),
    isTongPartUnlocked('body', cfg.body),
    isTongPartUnlocked('color', cfg.color),
    isTongPartUnlocked('wheel', cfg.wheel),
    isTongPartUnlocked('topper', cfg.topper)
  ];
  const firstLocked = checks.find(c => !c.ok);
  return firstLocked || { ok: true, label: 'Terbuka' };
}

function getTongConfig() {
  if (!S.w) return defaultTongConfig(1);
  if (!S.w.tongConfig) S.w.tongConfig = defaultTongConfig(S.user && S.user.p);
  const cfg = S.w.tongConfig;
  /* Sanitize legacy animal keys if ever encountered */
  if (cfg.body === 'royal') cfg.body = 'imperial';
  if (cfg.topper === 'horns') cfg.topper = 'beacon';
  return cfg;
}

function getTongBuildTitle(cfg) {
  const b = TONG_BODIES[cfg.body] || TONG_BODIES.classic;
  const sz = TONG_SIZES[cfg.size] || TONG_SIZES.normal;
  const wh = TONG_WHEELS[cfg.wheel] || TONG_WHEELS.standard;
  return `${b.n} ${cfg.size !== 'normal' ? sz.n.split(' ')[0] : ''} • ${wh.n}`.replace(/\s+/g, ' ').trim();
}

function drawRealisticFire(g, topY, bw, t, scale, botY) {
  const flick1 = Math.sin(t * 13.5);
  const flick2 = Math.cos(t * 19.2 + 0.8);
  const flick3 = Math.sin(t * 27.4 + 2.1);
  const intensity = 0.88 + 0.12 * (flick1 * 0.5 + flick2 * 0.5);
  const sway = flick1 * 1.4 + flick2 * 0.7;
  const flameH = 14.5 * intensity + flick3 * 1.1;

  /* 1. Cast Warm Firelight Pool on Ground Below Tong */
  g.save();
  g.globalCompositeOperation = 'lighter';
  const groundLight = g.createRadialGradient(0, 0, 1, 0, 0, 26 * intensity);
  groundLight.addColorStop(0, `rgba(255, 165, 50, ${0.42 * intensity})`);
  groundLight.addColorStop(0.55, `rgba(234, 88, 12, ${0.18 * intensity})`);
  groundLight.addColorStop(1, 'rgba(234, 88, 12, 0)');
  g.fillStyle = groundLight;
  g.beginPath();
  g.ellipse(0, 0, 26 * intensity, 7.5, 0, 0, Math.PI * 2);
  g.fill();
  g.restore();

  /* 2. Cast Warm Illumination onto Tong Upper Body & Rim */
  g.save();
  g.globalCompositeOperation = 'lighter';
  const bodyBounce = g.createRadialGradient(0, topY - 2, 1, 0, topY + 6, bw * 1.65);
  bodyBounce.addColorStop(0, `rgba(255, 210, 110, ${0.45 * intensity})`);
  bodyBounce.addColorStop(0.45, `rgba(249, 115, 22, ${0.22 * intensity})`);
  bodyBounce.addColorStop(1, 'rgba(249, 115, 22, 0)');
  g.fillStyle = bodyBounce;
  g.beginPath();
  g.ellipse(0, topY + 5, bw * 1.45, Math.max(10, (botY - topY) * 0.55), 0, 0, Math.PI * 2);
  g.fill();
  g.restore();

  /* 3. Forged Cast-Iron & Brass Brazier Bowl */
  g.fillStyle = '#1e293b';
  g.strokeStyle = INK;
  g.lineWidth = 0.9;
  g.beginPath();
  g.moveTo(-4.8, topY - 1.2);
  g.lineTo(-6.2, topY - 4.4);
  g.lineTo(6.2, topY - 4.4);
  g.lineTo(4.8, topY - 1.2);
  g.closePath();
  g.fill();
  g.stroke();

  /* Brass Rim on Brazier */
  g.fillStyle = '#f59e0b';
  g.fillRect(-6.4, topY - 4.8, 12.8, 1.3);

  /* Glowing Hot Ember Bed inside Brazier */
  const emberGrad = g.createLinearGradient(-5, 0, 5, 0);
  emberGrad.addColorStop(0, '#9a3412');
  emberGrad.addColorStop(0.5, '#fef08a');
  emberGrad.addColorStop(1, '#9a3412');
  g.fillStyle = emberGrad;
  g.beginPath();
  g.ellipse(0, topY - 4.5, 5.2, 1.5, 0, 0, Math.PI * 2);
  g.fill();

  const baseY = topY - 4.3;

  /* 4. Multi-Layered Atmospheric Bloom Halo Around Flame */
  g.save();
  g.globalCompositeOperation = 'lighter';
  const outerBloom = g.createRadialGradient(sway * 0.4, baseY - flameH * 0.45, 1.5, sway * 0.4, baseY - flameH * 0.45, 24 * intensity);
  outerBloom.addColorStop(0, `rgba(255, 235, 160, ${0.68 * intensity})`);
  outerBloom.addColorStop(0.32, `rgba(251, 146, 60, ${0.38 * intensity})`);
  outerBloom.addColorStop(0.68, `rgba(220, 38, 38, ${0.15 * intensity})`);
  outerBloom.addColorStop(1, 'rgba(220, 38, 38, 0)');
  g.fillStyle = outerBloom;
  g.beginPath();
  g.arc(sway * 0.4, baseY - flameH * 0.45, 24 * intensity, 0, Math.PI * 2);
  g.fill();
  g.restore();

  /* 5. Outer Crimson-Orange Flame Envelope (Organic Turbulent Silhouette) */
  const outerGrad = g.createLinearGradient(0, baseY, 0, baseY - flameH);
  outerGrad.addColorStop(0, '#ea580c');
  outerGrad.addColorStop(0.55, '#f97316');
  outerGrad.addColorStop(1, 'rgba(239, 68, 68, 0.25)');
  g.fillStyle = outerGrad;
  g.beginPath();
  g.moveTo(-5.2, baseY);
  g.bezierCurveTo(
    -6.4 + flick2 * 0.9, baseY - flameH * 0.35,
    -3.2 + sway * 0.8, baseY - flameH * 0.78,
    sway, baseY - flameH
  );
  g.bezierCurveTo(
    3.2 + sway * 0.8, baseY - flameH * 0.78,
    6.4 + flick3 * 0.9, baseY - flameH * 0.35,
    5.2, baseY
  );
  g.closePath();
  g.fill();

  /* Secondary Side Flame Lick */
  g.fillStyle = 'rgba(251, 146, 60, 0.82)';
  g.beginPath();
  g.moveTo(-3.4, baseY);
  g.quadraticCurveTo(-5.2, baseY - flameH * 0.45, -2.5 + flick2 * 1.3, baseY - flameH * 0.72);
  g.quadraticCurveTo(-0.8, baseY - flameH * 0.35, -0.5, baseY);
  g.closePath();
  g.fill();

  /* 6. Mid Bright Amber-Gold Flame Body */
  const midH = flameH * 0.74;
  const midGrad = g.createLinearGradient(0, baseY, 0, baseY - midH);
  midGrad.addColorStop(0, '#fde047');
  midGrad.addColorStop(0.65, '#f59e0b');
  midGrad.addColorStop(1, 'rgba(249, 115, 22, 0.4)');
  g.fillStyle = midGrad;
  g.beginPath();
  g.moveTo(-3.5, baseY);
  g.bezierCurveTo(
    -4.1, baseY - midH * 0.35,
    -1.9 + sway * 0.65, baseY - midH * 0.78,
    sway * 0.82, baseY - midH
  );
  g.bezierCurveTo(
    1.9 + sway * 0.65, baseY - midH * 0.78,
    4.1, baseY - midH * 0.35,
    3.5, baseY
  );
  g.closePath();
  g.fill();

  /* 7. Inner White-Hot Incandescent Core */
  const coreH = flameH * 0.44;
  const coreGrad = g.createLinearGradient(0, baseY, 0, baseY - coreH);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.7, '#fef9c3');
  coreGrad.addColorStop(1, 'rgba(254, 240, 138, 0.1)');
  g.fillStyle = coreGrad;
  g.beginPath();
  g.moveTo(-2.0, baseY);
  g.quadraticCurveTo(-2.2, baseY - coreH * 0.55, sway * 0.45, baseY - coreH);
  g.quadraticCurveTo(2.2, baseY - coreH * 0.55, 2.0, baseY);
  g.closePath();
  g.fill();

  /* 8. Rising Floating Sparks & Glowing Embers */
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 5; k++) {
    const life = ((t * 1.45 + k * 0.21) % 1);
    const sparkY = baseY - flameH * 0.65 - life * 13;
    const sparkX = sway * (1 - life * 0.4) + Math.sin(t * 7 + k * 2.3) * (2.2 + life * 2.5);
    const alpha = (1 - life) * 0.92;
    const r = Math.max(0.45, (1 - life) * 1.25);
    g.fillStyle = life < 0.4 ? `rgba(254, 240, 138, ${alpha})` : `rgba(251, 146, 60, ${alpha})`;
    g.beginPath();
    g.arc(sparkX, sparkY, r, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

function drawCustomTong(g, x, y, cfg, t, wheelDist, scale = 1, dir = 'd', moving = false) {
  const sz = TONG_SIZES[cfg.size] || TONG_SIZES.normal;
  const col = TONG_COLORS[cfg.color] || TONG_COLORS.kayu;
  const whSpec = TONG_WHEELS[cfg.wheel] || TONG_WHEELS.standard;
  const sw = sz.w, sh = sz.h;
  const whType = cfg.wheel || 'standard';
  const bdType = cfg.body || 'classic';
  const tpType = cfg.topper || 'antenna';
  const isFlame = tpType === 'flame';

  /* True rolling angular rotation proportional to wheel radius */
  const wheelAngle = wheelDist / (whSpec.r || 4.8);

  g.save();
  g.translate(x, y);
  g.scale(scale, scale);

  /* Ground Ambient Shadow */
  const shRx = (whType === 'tank' ? 16.5 : whType === 'monster' ? 16 : 13.8) * sw;
  g.fillStyle = 'rgba(10,20,38,.36)';
  g.beginPath();
  g.ellipse(0, 0.5, shRx, 3.6, 0, 0, Math.PI * 2);
  g.fill();

  /* Chassis Clearance & Suspension Motion */
  let liftY = 6.6;
  if (whType === 'monster') liftY = 9.8;
  else if (whType === 'tank') liftY = 7.6;
  else if (whType === 'spiked_wheel') liftY = 7.6;
  else if (whType === 'hover') liftY = 9.0 + Math.sin(t * 4.5) * 1.5;

  const suspBounce = whType === 'hover'
    ? 0
    : (moving ? Math.abs(Math.sin(wheelAngle * 2)) * 0.75 : Math.sin(t * 3) * 0.22);
  const bw = 10.5 * sw;
  const bh = 21.5 * sh;
  const botY = -liftY - suspBounce;
  const topY = botY - bh;

  /* 1. REALISTIC WHEELS / CHASSIS UNDERCARRIAGE */
  if (whType === 'hover') {
    const hw = bw * 1.18;
    const pulse = 0.72 + 0.28 * Math.sin(t * 11);

    /* Ground Plasma Projection */
    g.save();
    g.globalCompositeOperation = 'lighter';
    const pg = g.createRadialGradient(0, 0, 1, 0, 0, hw * 1.25);
    pg.addColorStop(0, `rgba(56, 189, 248, ${0.75 * pulse})`);
    pg.addColorStop(0.6, `rgba(14, 165, 233, ${0.28 * pulse})`);
    pg.addColorStop(1, 'rgba(56, 189, 248, 0)');
    g.fillStyle = pg;
    g.beginPath();
    g.ellipse(0, 0, hw * 1.25, 5.2, 0, 0, Math.PI * 2);
    g.fill();

    /* Thruster Cone Plumes */
    [-hw * 0.52, hw * 0.52].forEach(nx => {
      const tg = g.createLinearGradient(0, botY + 2, 0, 0);
      tg.addColorStop(0, `rgba(186, 230, 253, ${0.85 * pulse})`);
      tg.addColorStop(1, 'rgba(56, 189, 248, 0)');
      g.fillStyle = tg;
      g.beginPath();
      g.moveTo(nx - 2.4, botY + 2);
      g.lineTo(nx + 2.4, botY + 2);
      g.lineTo(nx + 4.4, 0);
      g.lineTo(nx - 4.4, 0);
      g.closePath();
      g.fill();
    });
    g.restore();

    /* Hover Turbine Cowling */
    const covGrad = g.createLinearGradient(-hw, 0, hw, 0);
    covGrad.addColorStop(0, '#0f172a');
    covGrad.addColorStop(0.5, '#334155');
    covGrad.addColorStop(1, '#0f172a');
    g.fillStyle = covGrad;
    g.strokeStyle = '#38bdf8';
    g.lineWidth = 1.1;
    g.beginPath();
    g.ellipse(0, botY + 1.2, hw, 3.6, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();

    [-hw * 0.55, 0, hw * 0.55].forEach(nx => {
      g.fillStyle = '#e0f2fe';
      g.beginPath();
      g.arc(nx, botY + 1.2, 1.35, 0, Math.PI * 2);
      g.fill();
    });
  } else if (whType === 'tank') {
    const tw = bw * 1.26, th = 7.6, ty = -th;
    /* Armored Fender Skirt Above Track */
    g.fillStyle = '#334155';
    g.strokeStyle = INK;
    g.lineWidth = 0.95;
    g.beginPath();
    g.moveTo(-tw * 1.04, ty + 1.5);
    g.lineTo(-tw * 0.92, ty - 2.2);
    g.lineTo(tw * 0.92, ty - 2.2);
    g.lineTo(tw * 1.04, ty + 1.5);
    g.closePath();
    g.fill();
    g.stroke();

    /* Outer Rubber/Steel Caterpillar Track Belt */
    g.fillStyle = '#0f172a';
    g.strokeStyle = INK;
    g.lineWidth = 1.15;
    g.beginPath();
    g.roundRect(-tw, ty, tw * 2, th, 3.8);
    g.fill();
    g.stroke();

    /* Inner Track Cavity */
    g.fillStyle = '#1e293b';
    g.beginPath();
    g.roundRect(-tw + 1.4, ty + 1.3, (tw - 1.4) * 2, th - 2.6, 2.6);
    g.fill();

    /* Articulated Moving Track Links (Top & Bottom Belt) */
    g.fillStyle = '#94a3b8';
    const pitch = 3.8;
    const offTop = ((wheelDist * 0.85) % pitch + pitch) % pitch;
    const offBot = (((-wheelDist * 0.85) % pitch) + pitch) % pitch;
    for (let tx = -tw + 2 + offTop; tx < tw - 2; tx += pitch) {
      g.fillRect(tx - 0.8, ty - 0.5, 1.6, 1.3);
    }
    for (let tx = -tw + 2 + offBot; tx < tw - 2; tx += pitch) {
      g.fillRect(tx - 0.8, ty + th - 0.8, 1.6, 1.3);
    }

    /* 3 Heavy Road Wheels + Drive Sprocket Teeth */
    [-tw * 0.62, 0, tw * 0.62].forEach((wx, idx) => {
      g.save();
      g.translate(wx, ty + th / 2);
      g.rotate(wheelAngle);
      g.fillStyle = idx === 1 ? '#94a3b8' : '#cbd5e1';
      g.strokeStyle = INK;
      g.lineWidth = 0.8;
      g.beginPath();
      g.arc(0, 0, 2.5, 0, Math.PI * 2);
      g.fill();
      g.stroke();
      /* Sprocket Cross-Bolts */
      g.strokeStyle = '#1e293b';
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(-2.1, 0); g.lineTo(2.1, 0);
      g.moveTo(0, -2.1); g.lineTo(0, 2.1);
      g.stroke();
      g.fillStyle = '#f59e0b';
      g.beginPath();
      g.arc(0, 0, 0.9, 0, Math.PI * 2);
      g.fill();
      g.restore();
    });
  } else {
    /* Dual Realistic Tires + Suspension Struts */
    const wxOff = bw * 0.88;
    const wr = whSpec.r;
    const wy = -wr + 0.2;

    /* Heavy Steel Axle & Differential Housing */
    g.fillStyle = '#1e293b';
    g.strokeStyle = INK;
    g.lineWidth = 0.85;
    g.fillRect(-wxOff, wy - 1.5, wxOff * 2, 3.0);
    g.strokeRect(-wxOff, wy - 1.5, wxOff * 2, 3.0);
    g.fillStyle = '#475569';
    g.beginPath();
    g.arc(0, wy, 2.4, 0, Math.PI * 2);
    g.fill();

    /* Coil-Over Suspension Struts */
    g.strokeStyle = whType === 'monster' ? '#f59e0b' : '#64748b';
    g.lineWidth = whType === 'monster' ? 1.8 : 1.3;
    g.beginPath();
    g.moveTo(-wxOff * 0.55, botY); g.lineTo(-wxOff * 0.92, wy);
    g.moveTo(wxOff * 0.55, botY); g.lineTo(wxOff * 0.92, wy);
    g.stroke();

    [-wxOff, wxOff].forEach(wx => {
      /* Individual Tire Contact Shadow */
      g.fillStyle = 'rgba(0,0,0,0.42)';
      g.beginPath();
      g.ellipse(wx, 0.3, wr * 0.85, 1.5, 0, 0, Math.PI * 2);
      g.fill();

      g.save();
      g.translate(wx, wy);
      g.rotate(wheelAngle);

      if (whType === 'spiked_wheel') {
        /* Industrial Sawtooth Steel Blades */
        g.fillStyle = '#e2e8f0';
        g.strokeStyle = INK;
        g.lineWidth = 0.75;
        const teeth = 10;
        for (let k = 0; k < teeth; k++) {
          const a = (k / teeth) * Math.PI * 2;
          g.save();
          g.rotate(a);
          g.beginPath();
          g.moveTo(wr - 1.1, -1.25);
          g.lineTo(wr + 2.2, 0.25);
          g.lineTo(wr - 1.1, 1.25);
          g.closePath();
          g.fill();
          g.stroke();
          g.restore();
        }
      } else {
        /* Realistic Rotating Rubber Tread Lugs Around Tire Perimeter */
        const lugs = whType === 'monster' ? 12 : 10;
        g.fillStyle = '#0f172a';
        for (let k = 0; k < lugs; k++) {
          const a = (k / lugs) * Math.PI * 2;
          g.save();
          g.rotate(a);
          g.fillRect(wr - 0.8, -1.0, 1.35, 2.0);
          g.restore();
        }
      }

      /* Rubber Tire Carcass */
      g.fillStyle = '#182032';
      g.strokeStyle = INK;
      g.lineWidth = 0.9;
      g.beginPath();
      g.arc(0, 0, wr, 0, Math.PI * 2);
      g.fill();
      g.stroke();

      /* Tire Sidewall Grooves (Makes Rotation Unmistakably Visible) */
      const sideR = wr * 0.78;
      g.strokeStyle = '#334155';
      g.lineWidth = 0.8;
      g.beginPath();
      g.arc(0, 0, sideR, 0.2, 1.2);
      g.stroke();
      g.beginPath();
      g.arc(0, 0, sideR, Math.PI + 0.2, Math.PI + 1.2);
      g.stroke();

      /* Racing Brake Disc & Red Caliper Behind Rim */
      const rimR = wr * (whType === 'racing' ? 0.68 : 0.60);
      if (whType === 'racing') {
        g.fillStyle = '#94a3b8';
        g.beginPath();
        g.arc(0, 0, rimR * 0.88, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#ef4444';
        g.fillRect(rimR * 0.35, -rimR * 0.45, rimR * 0.42, rimR * 0.48);
      }

      /* Metallic Alloy Rim */
      const rimGrad = g.createLinearGradient(-rimR, -rimR, rimR, rimR);
      rimGrad.addColorStop(0, whType === 'racing' ? '#fef08a' : '#f1f5f9');
      rimGrad.addColorStop(1, whType === 'racing' ? '#d97706' : '#94a3b8');
      g.fillStyle = rimGrad;
      g.strokeStyle = INK;
      g.lineWidth = 0.75;
      g.beginPath();
      g.arc(0, 0, rimR, 0, Math.PI * 2);
      g.fill();
      g.stroke();

      /* Spokes */
      g.strokeStyle = whType === 'racing' ? '#1e293b' : '#334155';
      g.lineWidth = whType === 'racing' ? 1.05 : 0.9;
      const spokes = whType === 'racing' ? 5 : 4;
      for (let k = 0; k < spokes; k++) {
        g.rotate((Math.PI * 2) / spokes);
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(rimR * 0.92, 0);
        g.stroke();
      }

      /* Center Hub Nut */
      g.fillStyle = '#0f172a';
      g.beginPath();
      g.arc(0, 0, 1.2, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#f8fafc';
      g.beginPath();
      g.arc(-0.3, -0.3, 0.45, 0, Math.PI * 2);
      g.fill();

      g.restore();
    });
  }

  /* 2. 3D SHADED TONG BODY & CRAFTED ARMOR */
  const bg = g.createLinearGradient(-bw * 1.1, 0, bw * 1.1, 0);
  bg.addColorStop(0, col.c[0]);
  bg.addColorStop(0.32, col.c[1]);
  bg.addColorStop(0.68, col.c[1]);
  bg.addColorStop(1, col.c[0]);
  g.fillStyle = bg;
  g.strokeStyle = INK;
  g.lineWidth = 1.1;

  if (bdType === 'armored') {
    /* Multi-Plate Heavy Titanium Armor */
    g.beginPath();
    g.moveTo(-bw * 0.86, botY);
    g.lineTo(-bw * 1.14, botY - bh * 0.28);
    g.lineTo(-bw * 1.14, topY + bh * 0.28);
    g.lineTo(-bw * 0.86, topY);
    g.lineTo(bw * 0.86, topY);
    g.lineTo(bw * 1.14, topY + bh * 0.28);
    g.lineTo(bw * 1.14, botY - bh * 0.28);
    g.lineTo(bw * 0.86, botY);
    g.closePath();
    g.fill();
    g.stroke();

    /* Chamfered Center Armor Seam */
    g.strokeStyle = 'rgba(255,255,255,0.35)';
    g.lineWidth = 0.85;
    g.beginPath();
    g.moveTo(-bw * 0.65, topY + 2);
    g.lineTo(-bw * 0.65, botY - 2);
    g.moveTo(bw * 0.65, topY + 2);
    g.lineTo(bw * 0.65, botY - 2);
    g.stroke();

    /* Corner Rivets */
    g.fillStyle = '#f8fafc';
    [[-bw * 0.9, topY + 4], [bw * 0.9, topY + 4], [-bw * 0.9, botY - 4], [bw * 0.9, botY - 4]].forEach(([rx, ry]) => {
      g.beginPath(); g.arc(rx, ry, 1.15, 0, Math.PI * 2); g.fill();
    });
  } else if (bdType === 'crystal') {
    /* Faceted Gemstone Prism Body */
    const midY = (topY + botY) / 2;
    g.beginPath();
    g.moveTo(-bw * 0.78, botY);
    g.lineTo(-bw * 1.20, midY);
    g.lineTo(-bw * 0.78, topY);
    g.lineTo(bw * 0.78, topY);
    g.lineTo(bw * 1.20, midY);
    g.lineTo(bw * 0.78, botY);
    g.closePath();
    g.fill();
    g.stroke();

    /* Translucent Internal Light Refraction Facets */
    g.fillStyle = 'rgba(255,255,255,0.24)';
    g.beginPath();
    g.moveTo(-bw * 0.78, topY);
    g.lineTo(0, midY);
    g.lineTo(-bw * 1.20, midY);
    g.closePath();
    g.fill();

    g.strokeStyle = 'rgba(255,255,255,0.65)';
    g.lineWidth = 0.85;
    g.beginPath();
    g.moveTo(-bw * 0.78, topY); g.lineTo(0, midY); g.lineTo(bw * 0.78, topY);
    g.moveTo(-bw * 0.78, botY); g.lineTo(0, midY); g.lineTo(bw * 0.78, botY);
    g.stroke();
  } else if (bdType === 'rocket') {
    /* Swept Aerospace Fins */
    g.fillStyle = col.band;
    g.strokeStyle = INK;
    g.lineWidth = 0.95;
    [-1, 1].forEach(side => {
      g.beginPath();
      g.moveTo(side * bw * 0.86, botY - 0.5);
      g.lineTo(side * bw * 1.52, botY + 2.2);
      g.lineTo(side * bw * 1.38, botY - bh * 0.25);
      g.lineTo(side * bw * 0.94, botY - bh * 0.52);
      g.closePath();
      g.fill();
      g.stroke();
    });

    /* Fuselage Cylinder */
    g.fillStyle = bg;
    g.beginPath();
    g.roundRect(-bw * 0.92, topY, bw * 1.84, bh, 3.6);
    g.fill();
    g.stroke();
  } else {
    /* Classic / Spiked / Imperial Curved Barrel */
    g.beginPath();
    g.moveTo(-bw * 0.85, botY);
    g.quadraticCurveTo(-bw * 1.18, (topY + botY) / 2, -bw * 0.85, topY);
    g.lineTo(bw * 0.85, topY);
    g.quadraticCurveTo(bw * 1.18, (topY + botY) / 2, bw * 0.85, botY);
    g.closePath();
    g.fill();
    g.stroke();

    /* Beveled Stave Planks */
    g.strokeStyle = 'rgba(15,20,35,0.34)';

  const d = dc();

  if (ins()) { if (NR.t === 'f') useFurn(NR.i); return; }
  if (NR.t === 'g') {
    if (NR.i > d) { TOAST = 'Gerbang ini tersegel kabut. Selesaikan gerbang sebelumnya untuk mendapat petunjuk jalan ke sini.'; TT = 5; return; }
    saveMap();
    openL(LS[NR.i].id);
  } else if (NR.t === 'c') {
    if (d < 4) { TOAST = 'Peti cahaya masih terkunci. Tuntaskan 4 Gerbang Wilayah dulu.'; TT = 5; }
    else if (getSeals() < REQUIRED_SEALS) {
      saveMap();
      S.tab = 'duel';
      render();
      pushNote(`Butuh ${REQUIRED_SEALS} Segel Kuil 🏛️ dari Arena!`, 'lv');
    } else finHarta();
  } else if (NR.t === 'h') enterHouse(NR.i);
  else if (NR.t === 'n') talk(NR.i);

  }

function randomizeTong() {
  if (!S.w) return;
  const pickUnlocked = (tab, obj) => {
    const unlockedKeys = Object.keys(obj).filter(k => isTongPartUnlocked(tab, k).ok);
    const pool = unlockedKeys.length ? unlockedKeys : [Object.keys(obj)[0]];
    return pool[Math.floor(Math.random() * pool.length)];
  };

  S.srNotice = '';

function drawShowroomStage(ts) {
  const cv = document.getElementById('srCv');
  if (!cv) { SR_RAF = 0; return; }
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = cv.clientWidth || 380, H = cv.clientHeight || 192;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  const g = cv.getContext('2d');
  const t = ts / 1000;
  if (S.srDrive) SR_DIST += 0.45;

  g.save();
  g.scale(dpr, dpr);

  /* Showroom Spotlight Backdrop */
  const bg = g.createRadialGradient(W / 2, H * 0.32, 10, W / 2, H * 0.5, W * 0.75);
  bg.addColorStop(0, '#1d4ed8');
  bg.addColorStop(0.55, '#0f172a');
  bg.addColorStop(1, '#060a18');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* Overhead Spotlight Cone */
  const cone = g.createLinearGradient(0, 0, 0, H * 0.86);
  cone.addColorStop(0, 'rgba(147,197,253,0.32)');
  cone.addColorStop(1, 'rgba(56,189,248,0)');
  g.fillStyle = cone;
  g.beginPath();
  g.moveTo(W * 0.34, 0);
  g.lineTo(W * 0.66, 0);
  g.lineTo(W * 0.84, H * 0.86);
  g.lineTo(W * 0.16, H * 0.86);
  g.closePath();
  g.fill();

  /* Moving Showroom Floor Grid Lines */
  const floorY = H * 0.82;
  g.fillStyle = 'rgba(15,23,42,0.78)';
  g.fillRect(0, floorY, W, H - floorY);
  g.strokeStyle = 'rgba(56,189,248,0.35)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(0, floorY);
  g.lineTo(W, floorY);
  g.stroke();

  const shift = ((SR_DIST * 3.1) % 32 + 32) % 32;
  g.strokeStyle = 'rgba(96,165,250,0.22)';
  g.lineWidth = 1.2;
  for (let gx = -32 + shift; gx < W + 32; gx += 32) {
    g.beginPath();
    g.moveTo(gx, floorY);
    g.lineTo(gx - 18, H);
    g.stroke();
  }

  /* Pedestal Ring */
  g.strokeStyle = '#ffc83d';
  g.lineWidth = 2;
  g.beginPath();
  g.ellipse(W / 2, floorY + 3, 76, 11, 0, 0, Math.PI * 2);
  g.stroke();

  /* Render Active or Previewed Custom Tong */
  const displayCfg = S.srPreview || getTongConfig();
  drawCustomTong(g, W / 2, floorY + 2, displayCfg, t, SR_DIST, 3.05, 'd', S.srDrive);

  g.restore();
  SR_RAF = requestAnimationFrame(drawShowroomStage);
}

}

function bindMap() {
  const j = $('#joy'), k = $('#knob'); if (!j || !k) return;
  let jid = -1;
  const mv = e => {
    const r = j.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const L = Math.hypot(dx, dy), M = 35, c = L > M ? M / L : 1;
    JOY.x = dx * c / M; JOY.y = dy * c / M;
    k.style.transform = `translate(${dx * c}px,${dy * c}px)`;
  };
  j.onpointerdown = e => { e.preventDefault(); j.setPointerCapture(e.pointerId); jid = e.pointerId; mv(e); };
  j.onpointermove = e => { if (e.pointerId === jid) mv(e); };
  const end = e => { if (e.pointerId === jid) { jid = -1; JOY.x = JOY.y = 0; k.style.transform = ''; } };
  j.onpointerup = end; j.onpointercancel = end;
}

window.addEventListener('keydown', e => {

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') KB.l = 1;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') KB.r = 1;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); mapTap(); }
});
window.addEventListener('keyup', e => {

});

function openL(id) {
  const l = LS.find(x => x.id === id);
  const doneRings = S.w.nodes[id] || 0;
  S.les = id;
  S.ring = doneRings >= 3 ? 1 : doneRings + 1;
  S.bkVal = l.bongkar ? l.bongkar.def : 0;
  recordBongkar(l, S.bkVal);
  S.exStep = 1;
  S.r2A = {};
  S.r2Sub = false;
  S.r3A = {};
  S.r3Sub = false;
  render();
}

function renderBongkarKonsep(l) {
  const b = l.bongkar;
  const v = Number(S.bkVal ?? b.def);
  let svg = '', readoutLeft = '', readoutRight = '';

  if (b.type === 'mod') {
    const rem = Math.pow(2, v) % 5;
    const pts = [
      { r: 1, x: 160, y: 26 },
      { r: 2, x: 224, y: 66 },
      { r: 4, x: 200, y: 132 },
      { r: 3, x: 120, y: 132 },
      { r: 0, x: 96, y: 66 }
    ];
    const cur = pts.find(p => p.r === rem);
    svg = `
      <svg class='bk-svg' viewBox='0 0 320 170'>
        <circle cx='160' cy='85' r='60' fill='none' stroke='#cbd5e1' stroke-width='3' stroke-dasharray='5 4'/>
        <line x1='160' y1='85' x2='${cur.x}' y2='${cur.y}' stroke='#2563eb' stroke-width='4' stroke-linecap='round'/>
        ${pts.map(p => {
          const hit = p.r === rem;
          return `<g>
            <circle cx='${p.x}' cy='${p.y}' r='${hit ? 16 : 12}' fill='${hit ? (rem === 1 ? '#8ef0bf' : '#ffc83d') : '#fafdff'}' stroke='#14214d' stroke-width='2.5'/>
            <text x='${p.x}' y='${p.y + 4}' text-anchor='middle' font-size='11' font-weight='800' fill='#14214d'>${p.r}</text>
          </g>`;
        }).join('')}
        <text x='160' y='89' text-anchor='middle' font-size='12' font-weight='800' fill='#14214d'>mod 5</text>
        <text x='160' y='162' text-anchor='middle' font-size='10' font-weight='700' fill='#52648c'>Siklus sisa 2ⁿ mod 5: 2 → 4 → 3 → 1</text>
      </svg>`;
    readoutLeft = `Pangkat n = ${v}  (2^${v} = ${Math.pow(2, v)})`;
    readoutRight = rem === 1 ? '✅ Sisa = 1 (Siklus Reset!)' : `Sisa = ${rem}`;
  } else if (b.type === 'para') {
    const D = 16 - 4 * v;
    const mapX = x => 30 + ((x + 1) / 6) * 260;
    const mapY = y => 122 - y * 13;
    let dPath = '';
    for (let i = 0; i <= 60; i++) {
      const x = -1 + (i / 60) * 6;
      const y = x * x - 4 * x + v;
      dPath += (i === 0 ? 'M' : 'L') + `${mapX(x).toFixed(1)},${mapY(y).toFixed(1)} `;
    }
    const r1 = D >= 0 ? 2 - Math.sqrt(D) / 2 : null;
    const r2 = D >= 0 ? 2 + Math.sqrt(D) / 2 : null;
    svg = `
      <svg class='bk-svg' viewBox='0 0 320 170'>
        <line x1='20' y1='${mapY(0)}' x2='300' y2='${mapY(0)}' stroke='#14214d' stroke-width='2'/>
        <line x1='${mapX(0)}' y1='14' x2='${mapX(0)}' y2='148' stroke='#cbd5e1' stroke-width='1.5'/>
        <path d='${dPath}' fill='none' stroke='#2563eb' stroke-width='3.5' stroke-linecap='round'/>
        <circle cx='${mapX(2)}' cy='${mapY(v - 4)}' r='5.5' fill='#1fb5e6' stroke='#14214d' stroke-width='2'/>
        ${D > 0 ? `
          <circle cx='${mapX(r1)}' cy='${mapY(0)}' r='5.5' fill='#8ef0bf' stroke='#14214d' stroke-width='2'/>
          <circle cx='${mapX(r2)}' cy='${mapY(0)}' r='5.5' fill='#8ef0bf' stroke='#14214d' stroke-width='2'/>
        ` : D === 0 ? `
          <circle cx='${mapX(2)}' cy='${mapY(0)}' r='6.5' fill='#ffc83d' stroke='#14214d' stroke-width='2'/>
        ` : ''}
        <text x='160' y='162' text-anchor='middle' font-size='10' font-weight='700' fill='#52648c'>f(x) = x² − 4x + ${v} • Sumbu-X (garis tebal)</text>
      </svg>`;
    readoutLeft = `c = ${v}  |  D = 16 − 4(${v}) = ${D}`;
    readoutRight = D > 0 ? '2 Akar Real' : D === 0 ? '1 Akar Kembar' : 'Melayang (0 Akar)';
  } else if (b.type === 'pyth') {
    const a = v, bSide = 4, c = Math.sqrt(a * a + bSide * bSide);
    const sc = 15, x0 = 95, y0 = 128;
    const xA = x0 + a * sc, yB = y0 - bSide * sc;
    svg = `
      <svg class='bk-svg' viewBox='0 0 320 170'>
        <polygon points='${x0},${y0} ${xA},${y0} ${x0},${yB}' fill='#e7f2ff' stroke='#14214d' stroke-width='2.5'/>
        <rect x='${x0}' y='${y0 - 11}' width='11' height='11' fill='none' stroke='#14214d' stroke-width='1.8'/>
        <line x1='${x0}' y1='${y0}' x2='${xA}' y2='${y0}' stroke='#2563eb' stroke-width='4'/>
        <line x1='${x0}' y1='${y0}' x2='${x0}' y2='${yB}' stroke='#0ea5e9' stroke-width='4'/>
        <line x1='${xA}' y1='${y0}' x2='${x0}' y2='${yB}' stroke='#16a34a' stroke-width='4'/>
        <text x='${(x0 + xA) / 2}' y='${y0 + 15}' text-anchor='middle' font-size='11' font-weight='800' fill='#2563eb'>a = ${a}</text>
        <text x='${x0 - 18}' y='${(y0 + yB) / 2 + 4}' text-anchor='middle' font-size='11' font-weight='800' fill='#0284c7'>b = 4</text>
        <text x='${(x0 + xA) / 2 + 18}' y='${(y0 + yB) / 2 - 6}' text-anchor='middle' font-size='11' font-weight='800' fill='#14532d'>c = ${Number.isInteger(c) ? c : '√' + (a * a + 16)}</text>
        <text x='160' y='162' text-anchor='middle' font-size='10' font-weight='700' fill='#52648c'>${a}² + 4² = ${a * a} + 16 = ${a * a + 16} = c²</text>
      </svg>`;
    readoutLeft = `Alas a = ${a}, Tinggi b = 4`;
    readoutRight = Number.isInteger(c) ? `✅ Tripel (${a}, 4, ${c})` : `c = √${a * a + 16} ≈ ${c.toFixed(2)}`;
  } else {
    const xVal = v / 100;
    const isHole = v === 200;
    const yVal = xVal + 2;
    const mapX = x => 40 + ((x - 1.4) / 1.2) * 240;
    const mapY = y => 140 - ((y - 3.2) / 1.6) * 116;
    const hx = mapX(2), hy = mapY(4);
    const px = mapX(xVal), py = mapY(yVal);
    svg = `
      <svg class='bk-svg' viewBox='0 0 320 170'>
        <line x1='35' y1='${hy}' x2='285' y2='${hy}' stroke='#cbd5e1' stroke-width='1.5' stroke-dasharray='4 4'/>
        <line x1='${hx}' y1='16' x2='${hx}' y2='145' stroke='#cbd5e1' stroke-width='1.5' stroke-dasharray='4 4'/>
        <line x1='${mapX(1.45)}' y1='${mapY(3.45)}' x2='${mapX(2.55)}' y2='${mapY(4.55)}' stroke='#0ea5e9' stroke-width='3.5'/>
        <circle cx='${hx}' cy='${hy}' r='6.5' fill='#fafdff' stroke='#dc2626' stroke-width='2.5'/>
        <circle cx='${px}' cy='${py}' r='7' fill='${isHole ? '#2563eb' : '#ffc83d'}' stroke='#14214d' stroke-width='2'/>
        <text x='${hx + 10}' y='${hy + 4}' font-size='10' font-weight='800' fill='#dc2626'>Lubang (2, 4)</text>
        <text x='160' y='162' text-anchor='middle' font-size='10' font-weight='700' fill='#52648c'>f(x) = (x² − 4)/(x − 2) • Saat x → 2, tinggi grafik → 4</text>
      </svg>`;
    readoutLeft = `x = ${xVal.toFixed(2)}`;
    readoutRight = isHole ? '⚠️ f(2) = 0/0 (Berlubang!)' : `f(${xVal.toFixed(2)}) = ${yVal.toFixed(2)}`;
  }

  const hitsArr = (S.w && S.w.bkHits && S.w.bkHits[l.id]) || [];
  const done = isBongkarComplete(l);
  const taskHtml = b.targets.map((tg, idx) => {
    const ok = hitsArr.includes(idx);
    return `<div class='bk-task ${ok ? 'hit' : ''}'><span>${ok ? '✅' : '🎯'}</span><span>${tg.label}</span></div>`;
  }).join('');

  return `
    <section class='bk-box'>
      <div class='row bt'>
        <span class='tag cy' style='margin:0'>🎛️ Bongkar Konsep</span>
        <span style='font-size:.74rem;font-weight:800;color:${done ? 'var(--ok-txt)' : 'var(--mut)'}'>${hitsArr.length}/${b.targets.length} Kondisi Teruji</span>
      </div>
      <p class='mut' style='margin-top:4px'>${l.tongTip}</p>
      ${svg}
      <div class='bk-readout'>
        <span>${readoutLeft}</span>
        <span>${readoutRight}</span>
      </div>
      <input type='range' class='bk-sl' min='${b.min}' max='${b.max}' step='${b.step}' value='${v}' oninput='onBongkarInput(this.value)'>
      <div class='bk-tasks'>${taskHtml}</div>
      ${done
        ? `<div class='bk-aha'>💡 <b>AI Diagnosis Visual:</b> ${b.insight}</div>`
        : `<div class='bk-aha lock'>🔒 Geser slider di atas untuk memenuhi semua kondisi batas dan membuka kesimpulan konsep.</div>`
      }
    </section>`;
}

function completeRing1() {
  const l = LS.find(x => x.id === S.les);
  if ((S.w.nodes[l.id] || 0) < 1) {
    S.w.nodes[l.id] = 1;
    gain(20, 'Ring 1 Inti Konsep tuntas!');
  }
  S.ring = 2;
  render();
}
function submitRing2() {
  const l = LS.find(x => x.id === S.les);
  S.r2Sub = true;
  if ((S.w.nodes[l.id] || 0) < 2) {
    S.w.nodes[l.id] = 2;
    gain(25, 'Ring 2 Cek Pemahaman tuntas!');
  }
  render();
}
function submitRing3() {
  const l = LS.find(x => x.id === S.les);
  const idx = LS.findIndex(x => x.id === l.id);
  S.r3Sub = true;
  let score = 0;
  l.drills.forEach((q, qi) => { if (S.r3A[qi] === q[2]) score++; });
  const acc = Math.round((score / l.drills.length) * 100);
  const wasDone = (S.w.nodes[l.id] || 0) >= 3;

  S.w.nodes[l.id] = 3;
  S.w.shields = 3;
  if (S.w.brokenGate === l.id) S.w.brokenGate = null;
  S.w.prac.unshift({ t: l.topic + ' (Ring 3)', ok: score, n: l.drills.length });
  if (S.w.prac.length > 20) S.w.prac.length = 20;

  if (!wasDone) {
    if (idx === 0) badge('awal');
    if (!S.w.clues.includes(idx)) S.w.clues.push(idx);
    if (idx + 1 < 4) {
      S.w.found[idx + 1] = 1;
      revealAt(GATE[idx + 1][0], GATE[idx + 1][1], 9.5);
    }
    act('Gerbang ' + l.n + ' Tuntas', `3/3 Ring (${acc}%) • Skin Showroom Gerbang ${idx + 1} Terbuka!`);
    plog(`menuntaskan Gerbang ${l.n} (${acc}%)`);
    gain(l.boss ? 110 : 75, `Gerbang ${l.n} terbuka & Skin Showroom baru terbuka!`);
  } else {
    act('Latihan Ulang ' + l.n, `Perisai Konsep dipulihkan ke 3/3 🛡️`);
    gain(20, 'Perisai Konsep dipulihkan 3/3!');
  }
  ign();
  modal(`
    <div class='pn reward-card' style='text-align:center'>
      <span class='tag gold'>🎉 Gerbang Terbuka • ${l.c}</span>
      <h3 class='ttl' style='font-size:1.15rem'>${l.n} Tuntas!</h3>
      <p class='mut' style='margin-top:6px'>Skor Ring 3: <b>${score}/${l.drills.length}</b> • <b>Perisai Konsep: 3/3 🛡️</b></p>
      ${!wasDone ? `<div class='it gold-box' style='margin-top:8px;font-size:.79rem'>🛠️ <b>Part Tong Gerbang ${idx + 1}</b> kini terbuka di Showroom Bengkel!</div>` : ''}
      <div class='it' style='margin-top:10px;text-align:left'>
        <b>📜 Secarik Peta #${idx + 1}</b>
        <p class='mut' style='margin-top:4px'>${l.clue}</p>
      </div>
      ${l.cliffhanger ? `<div class='cliff-box'>🔭 ${l.cliffhanger}</div>` : ''}
      <button class='btn w' style='margin-top:14px' onclick='modal("");S.les=null;render()'>Lanjutkan Perjalanan ▶</button>
    </div>`);
  render();
}

function startQuickReview() {
  const maxUnlocked = Math.max(0, dc());

function seekVideo(e) {

  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  S.vid.prog = ratio;
  if (ratio >= 1) finishVideoConcept();
  else renderVideoModal();
}
function finishVideoConcept() {
  if (!S.vid) return;
  const v = S.vid;
  v.prog = 1;
  v.playing = false;
  if (!v.claimed) {
    v.claimed = true;
    if (!S.w.watchedVids) S.w.watchedVids = [];

    const prevSh = getShields();

    gain(15, prevSh < 3 ? '+1 Token Perisai 🛡️!' : 'Konsep dipahami!');

}
function videoLoop(ts) {
  if (!S.vid || !S.vid.playing) { VID_RAF = 0; return; }
  const dt = Math.min(.08, (ts - S.vid.lastTs) / 1000);
  S.vid.lastTs = ts;
  const durationSec = 10;
  S.vid.prog += (dt * S.vid.speed) / durationSec;
  if (S.vid.prog >= 1) {
    finishVideoConcept();
    VID_RAF = 0;
    return;
  }
  const bar = document.getElementById('vidBarFill');
  if (bar) bar.style.width = Math.round(S.vid.prog * 100) + '%';
  const subEl = document.getElementById('vidSubText');
  const found = findSubSubBab(S.vid.ssbId);
  if (subEl && found) {
    const idx = Math.min(found.ssb.scenes.length - 1, Math.floor(S.vid.prog * found.ssb.scenes.length));
    const nextText = `(${idx + 1}/${found.ssb.scenes.length}) ${found.ssb.scenes[idx]}`;
    if (subEl.textContent !== nextText) subEl.textContent = nextText;
  }
  drawVideoCanvas();
  VID_RAF = requestAnimationFrame(videoLoop);
}
function drawVideoCanvas() {
  const cv = document.getElementById('vidCv');
  if (!cv || !S.vid) return;
  const found = findSubSubBab(S.vid.ssbId);
  if (!found) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = cv.clientWidth || 360, H = cv.clientHeight || 178;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.save();
  g.scale(dpr, dpr);

  const p = S.vid.prog;
  const anim = found.bab.anim;
  g.fillStyle = '#09142b';
  g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(56,189,248,0.14)';
  g.lineWidth = 1;
  for (let x = 20; x < W; x += 28) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 20; y < H; y += 28) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

  const cx = W / 2, cy = H / 2 + 4;
  if (anim === 'mod') {
    const step = Math.floor(p * 8) + 1;
    const pts = [
      { r: 1, x: cx, y: cy - 52 },
      { r: 2, x: cx + 56, y: cy - 16 },
      { r: 4, x: cx + 35, y: cy + 48 },
      { r: 3, x: cx - 35, y: cy + 48 },
      { r: 0, x: cx - 56, y: cy - 16 }
    ];
    const rem = Math.pow(2, step) % 5;
    const cur = pts.find(pt => pt.r === rem);
    g.strokeStyle = '#38bdf8'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(cx, cy, 52, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = '#ffc83d'; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cur.x, cur.y); g.stroke();
    pts.forEach(pt => {
      const hit = pt.r === rem;
      g.fillStyle = hit ? (rem === 1 ? '#8ef0bf' : '#2563eb') : '#1e293b';
      g.strokeStyle = '#fff'; g.lineWidth = 2;
      g.beginPath(); g.arc(pt.x, pt.y, hit ? 14 : 10, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = hit ? (rem === 1 ? '#14214d' : '#ffffff') : '#f8fafc';
      g.font = 'bold 11px sans-serif'; g.textAlign = 'center';
      g.fillText(String(pt.r), pt.x, pt.y + 4);
    });
    g.fillStyle = '#7dd3fc'; g.font = 'bold 12px monospace';
    g.fillText(`2^${step} ≡ ${rem} (mod 5)`, cx, 22);
  } else if (anim === 'para') {
    const cVal = 1 + p * 5;
    const axisY = cy + 32;
    g.strokeStyle = '#94a3b8'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(30, axisY); g.lineTo(W - 30, axisY); g.stroke();
    g.strokeStyle = '#38bdf8'; g.lineWidth = 3.5;
    g.beginPath();
    for (let i = 0; i <= 60; i++) {
      const x = -1 + (i / 60) * 6;
      const y = x * x - 4 * x + cVal;
      const sx = cx - 90 + ((x + 1) / 6) * 180;
      const sy = axisY - y * 13;
      if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy);
    }
    g.stroke();
    const vy = axisY - (cVal - 4) * 13;
    g.fillStyle = cVal > 4 ? '#ffc83d' : '#8ef0bf';
    g.beginPath(); g.arc(cx, vy, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#7dd3fc'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
    g.fillText(`D = ${(16 - 4 * cVal).toFixed(1)} • ${cVal > 4 ? 'Melayang (D < 0)' : 'Memotong Sumbu-X'}`, cx, 22);
  } else if (anim === 'pyth') {
    const a = 3 + Math.sin(p * Math.PI) * 3;
    const b = 4;
    const c = Math.hypot(a, b);
    const x0 = cx - 55, y0 = cy + 44, sc = 17;
    const x1 = x0 + a * sc, y1 = y0 - b * sc;
    g.fillStyle = 'rgba(56,189,248,0.22)';
    g.strokeStyle = '#38bdf8'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.lineTo(x0, y1); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = '#ffc83d'; g.lineWidth = 2;
    g.strokeRect(x0, y0 - 10, 10, 10);
    g.fillStyle = '#f8fafc'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
    g.fillText(`a² + b² = c²  (${a.toFixed(1)}² + 4² = ${c.toFixed(1)}²)`, cx, 22);
  } else if (anim === 'lim') {
    const xPos = p < 0.5 ? 1.5 + p * 0.98 : 2.5 - (p - 0.5) * 0.98;
    const hx = cx, hy = cy - 4;
    g.strokeStyle = '#8ef0bf'; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(cx - 100, hy + 42); g.lineTo(cx + 100, hy - 42); g.stroke();
    g.fillStyle = '#09142b'; g.strokeStyle = '#38bdf8'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(hx, hy, 7, 0, Math.PI * 2); g.fill(); g.stroke();
    const px = cx + (xPos - 2) * 180;
    const py = hy - (xPos - 2) * 76;
    g.fillStyle = '#ffc83d';
    g.beginPath(); g.arc(px, py, 6.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#7dd3fc'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
    g.fillText(`x = ${xPos.toFixed(2)}  →  f(x) → 4.00`, cx, 22);
  } else {
    const items = 3 + Math.floor(p * 3);
    g.fillStyle = '#7dd3fc'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
    g.fillText(`Pencacahan: ${items} × 2 = ${items * 2} Kombinasi`, cx, 22);
    for (let i = 0; i < items; i++) {
      const bx = cx - ((items - 1) * 34) / 2 + i * 34;
      g.fillStyle = '#38bdf8'; g.beginPath(); g.arc(bx, cy - 22, 10, 0, Math.PI * 2); g.fill();
      for (let j = 0; j < 2; j++) {
        const lx = bx + (j === 0 ? -10 : 10);
        g.strokeStyle = '#ffc83d'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(bx, cy - 12); g.lineTo(lx, cy + 28); g.stroke();
        g.fillStyle = '#8ef0bf'; g.beginPath(); g.arc(lx, cy + 32, 7, 0, Math.PI * 2); g.fill();
      }
    }
  }
  g.restore();
}

function startD() {
  const sh = getShields(), d = dc();
  if (d < 1 || sh <= 0) { render(); return; }
  if (S.du) exitDuel();
  S.w.shields = Math.max(0, sh - 1);
  const pool = LS.slice(0, d)
    .flatMap(l => l.drills.map(q => ({ gateId: l.id, topic: l.topic, q })));
  S.du = {
    on: S.user.g === 'Laki-laki' ? 'Raka Pratama' : 'Alya Putri',
    qs: shuf(pool).slice(0, 4),
    i: 0, us: 0, os: 0, uSh: 3, oSh: 3, t: 20,
    brokenGate: null, rpDelta: 0, xpEarned: FIXED_DUEL_XP, clean: false, sealEarned: false,
    ph: 'buzz', msg: '−1 Token kesempatan dipakai (Gratis) • Pahami soal sebelum menekan TOMBOL!',
    ch: null, el: null, tm: 0, iv: 0, done: false
  };
  roundStart(); render();
}
function resetDuelTimer(sec) {
  const m = S.du; if (!m) return;
  m.t = sec;
  const el = document.getElementById('dtm');
  if (el) el.textContent = '00:' + String(Math.max(0, m.t)).padStart(2, '0');
  clearInterval(m.iv);
  m.iv = setInterval(tickDuel, 1000);
}
function crackPlayerShield(m, gateId) {
  m.uSh = Math.max(0, m.uSh - 1);
  m.brokenGate = gateId;
  S.w.brokenGate = gateId;
}
function tickDuel() {
  const m = S.du;
  if (!m || m.done) return;
  if (m.t > 0) {
    m.t--;
    const el = document.getElementById('dtm');
    if (el) el.textContent = '00:' + String(Math.max(0, m.t)).padStart(2, '0');
  }
}
function roundStart() {
  const m = S.du; if (!m) return;
  clearTimeout(m.tm);
  m.ph = 'buzz'; m.ch = null; m.el = null;
  m.msg = m.i === 0
    ? '−1 Token kesempatan dipakai (Gratis • Isi ulang di Gerbang/Video) • Pahami soal!'
    : 'Pahami soal sebelum menekan TOMBOL!';
  resetDuelTimer(20);
  m.tm = setTimeout(oppBuzz, 3000 + Math.random() * 5500);
}
function oppBuzz() {
  const m = S.du; if (!m || m.ph !== 'buzz') return;
  m.ph = 'opp'; m.msg = m.on + ' menekan TOMBOL!'; render();
  m.tm = setTimeout(() => {
    const item = m.qs[m.i], q = item.q;
    if (Math.random() < .58) {
      m.os += 100; m.ch = q[2]; m.ph = 'rev';
      m.msg = `${m.on} benar (+100). Kunci: ${'ABCD'[q[2]]}.`; render();
      m.tm = setTimeout(nextD, 1900);
    } else {
      m.os = Math.max(0, m.os - 50);
      m.oSh = Math.max(0, m.oSh - 1);
      const wrongOpts = [0, 1, 2, 3].filter(k => k !== q[2]);
      m.el = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];
      m.ph = 'rbme';
      resetDuelTimer(12);
      m.msg = `${m.on} salah (−50)! Soal dilempar ke kamu.`; render();
      m.tm = setTimeout(() => {
        if (S.du && S.du.ph === 'rbme') {
          m.ph = 'rev'; m.ch = q[2];
          m.msg = `Waktu lemparan habis. Kunci: ${'ABCD'[q[2]]}.`; render();
          m.tm = setTimeout(nextD, 1800);
        }
      }, 12000);
    }
  }, 1500);
}
function buzz() {
  const m = S.du; if (!m || m.ph !== 'buzz' || m.uSh <= 0) return;
  clearTimeout(m.tm);
  m.ph = 'me'; resetDuelTimer(12);
  m.msg = 'Kamu menekan TOMBOL! Jawab dalam 12 detik.'; render();
  m.tm = setTimeout(() => {
    if (S.du && S.du.ph === 'me') {
      const item = m.qs[m.i];
      m.us = Math.max(0, m.us - 50);
      crackPlayerShield(m, item.gateId);
      m.ph = 'rbop';
      m.msg = 'Waktu habis! Perisai retak (−50), dilempar ke ' + m.on + '.'; render();
      m.tm = setTimeout(oppRb, 1500);
    }
  }, 12000);
}
function oppRb() {
  const m = S.du; if (!m || m.ph !== 'rbop') return;
  const item = m.qs[m.i], q = item.q;
  if (Math.random() < .5) {
    m.os += 100; m.msg = `${m.on} benar (+100). Kunci: ${'ABCD'[q[2]]}.`;
  } else {
    m.msg = `${m.on} juga melewati lemparan. Kunci: ${'ABCD'[q[2]]}.`;
  }
  m.ch = q[2]; m.ph = 'rev'; render();
  m.tm = setTimeout(nextD, 1900);
}
function passRb() {
  const m = S.du; if (!m || m.ph !== 'rbme') return;
  clearTimeout(m.tm);
  const q = m.qs[m.i].q;
  m.ch = q[2]; m.ph = 'rev';
  m.msg = `Kamu melewati lemparan. Kunci: ${'ABCD'[q[2]]}.`; render();
  m.tm = setTimeout(nextD, 1600);
}
function pickD(i) {
  const m = S.du; if (!m || (m.ph !== 'me' && m.ph !== 'rbme')) return;
  clearTimeout(m.tm);
  const item = m.qs[m.i], q = item.q, ok = i === q[2], rb = m.ph === 'rbme';
  m.ch = i;
  if (ok) {
    m.us += 100; m.ph = 'rev';
    m.msg = `Tepat! (+100) Kunci: ${'ABCD'[q[2]]}.`; render();
    m.tm = setTimeout(nextD, 1700);
  } else if (rb) {
    m.ph = 'rev';
    m.msg = `Kurang tepat pada lemparan. Kunci: ${'ABCD'[q[2]]}.`; render();
    m.tm = setTimeout(nextD, 1900);
  } else {
    m.us = Math.max(0, m.us - 50);
    crackPlayerShield(m, item.gateId);
    m.ph = 'rbop';
    m.msg = 'Salah! −50 & 1 Perisai retak • Dilempar ke ' + m.on; render();
    m.tm = setTimeout(oppRb, 1500);
  }
}
function nextD() {
  const m = S.du; if (!m) return;
  if (m.i < m.qs.length - 1) {
    m.i++;
    if (m.uSh <= 0) {
      m.ph = 'opp'; m.msg = 'Perisai duel kamu habis! ' + m.on + ' menyelesaikan soal terakhir.'; render();
      m.tm = setTimeout(() => {
        if (Math.random() < .6) m.os += 100;
        m.ch = m.qs[m.i].q[2]; m.ph = 'rev'; render();
        m.tm = setTimeout(nextD, 1600);
      }, 1400);
      return;
    }
    roundStart(); render(); return;
  }
  clearInterval(m.iv); m.done = true; m.ph = 'end';
  m.o = m.us > m.os ? 'Menang' : m.us < m.os ? 'Kalah' : 'Seri';
  m.clean = m.uSh === 3;
  m.rpDelta = FIXED_RP_GAIN;
  m.xpEarned = FIXED_DUEL_XP;
  S.w.rp = Math.max(0, (S.w.rp || 0) + m.rpDelta);

  const prevSeals = getSeals();
  S.w.seals = Math.min(REQUIRED_SEALS, prevSeals + 1);
  m.sealEarned = S.w.seals > prevSeals;

  S.w.duel.unshift({ o: m.o, on: m.on, us: m.us, os: m.os, rpDelta: m.rpDelta, xpEarned: m.xpEarned, clean: m.clean, sealEarned: m.sealEarned });
  if (S.w.duel.length > 20) S.w.duel.length = 20;
  act('Duel vs ' + m.on, `${m.o} (${m.us}-${m.os}) • −1 Token 🛡️ • +${m.rpDelta} RP • +${m.xpEarned} XP${m.sealEarned ? ' • +1 Segel Kuil' : ''}`);
  gain(m.xpEarned, 0);
  if (m.o === 'Menang') badge('duel');
  ign(); render();
}

function showBadgeDetail(id) {
  const b = BADGE_CATALOG.find(x => x.id === id);
  if (!b || !S.w) return;
  const unlocked = b.keys.some(k => S.w.bdg.includes(k));
  modal(`
    <div class='pn ${unlocked ? 'reward-card' : ''}' style='text-align:center'>
      <span class='tag ${unlocked ? 'gold' : ''}' style='margin:0 auto 8px'>${unlocked ? '✨ Lencana Terbuka' : '🔒 Lencana Terkunci'}</span>
      <div style='width:96px;height:102px;margin:4px auto 8px;${unlocked ? '' : 'filter:grayscale(1) opacity(.7)'}'>

}

function render() {
  const u = S.user, app = $('#app'), top = $('#top'), nav = $('#nav');
  const full = isFullScreenView();
  document.body.style.overflow = full ? 'hidden' : '';

  if (!(S.tab === 'belajar' && !S.les && !S.quick)) {
    cancelAnimationFrame(MR);
    MR = 0;
    clearInterval(TYPE);
    TYPING = false;
  }

  if (!u) {
    app.style.cssText = ''; top.style.display = 'none'; nav.style.display = 'none';
    $('#main').innerHTML = `
      <section class='pn hero' style='margin-top:18px'>
        <div class='row'>
          <div class='kj'>旅</div>
          <div>
            <span class='tag' style='margin:0'>Paham Konsep, Taklukkan Soal</span>
            <h1 class='ttl' style='font-size:1.45rem;margin-top:4px'>Rascademy</h1>
          </div>
        </div>
      </section>
      <section class='pn'>
        <h3 class='ttl' style='font-size:1.05rem'>Pilih Akun Siswa</h3>
        ${ACC.map(a => {
          const lv = getLevel(DB[a.id].xp);
          const rk = getRank(DB[a.id]);
          return `
            <button class='opt' onclick='login("${a.id}")'>
              <b>${a.name[0]}</b>
              <div>
                <div>${a.name}</div>
                <small class='mut'>${a.gr} • Lv.${lv.lv} (${DB[a.id].xp} XP) • ${rk.name}</small>
              </div>
            </button>`;
        }).join('')}
      </section>`;
    return;
  }

  nav.style.display = '';
  nav.classList.toggle('ex', S.tab === 'duel' && !!S.du);
  nav.innerHTML = [
    ['belajar', '旅', 'Petualang'],
    ['duel', '闘', 'Cerdas Cermat'],
    ['profil', '我', 'Saya']
  ].map(([k, kj, lb]) => `
    <button class='${S.tab === k ? 'on' : ''}' onclick='goTab("${k}")'>
      <span class='k'>${kj}</span>
      <span>${lb}</span>
    </button>`).join('');

  if (S.tab === 'belajar' && !S.les && !S.quick) {
    const lv = getLevel(S.w.xp);
    app.style.cssText = 'max-width:none;padding:0';
    top.style.display = 'none';
    $('#main').innerHTML = `
      <div id='mapwrap'>
        <div id='xpb' class='xpb'><i style='width:${lv.pct}%'></i></div>
        <div id='plt' class='plate' onclick='menuMap()'>Gerbang ${dc()}/4 • Segel ${getSeals()}/${REQUIRED_SEALS} • Lv.${lv.lv}</div>
        <button class='plate' style='left:auto;right:10px;cursor:pointer' onclick='menuMap()'>☰ Menu</button>
        <div id='win' class='win' onclick='mapTap()'></div>
        <div id='nt' class='note'></div>
        <div id='joy' class='joy'>
          <i id='knob'></i>
        </div>
        <button id='act' class='abtn' onclick='mapTap()'>A</button>
      </div>`;
    bindMap();
    if (INTRO !== null) typeIntro();
    startMap();
    return;
  }

  app.style.cssText = '';
  if (S.tab === 'duel' && S.du) {
    top.style.display = 'none';
    studio();
    return;
  }

  top.style.display = '';
  const lv = getLevel(S.w.xp);
  const rk = getRank(S.w);
  top.innerHTML = `
    <div class='row' style='min-width:0;flex:1'>
      <div class='kj' style='width:42px;height:42px;font-size:1.1rem'>旅</div>
      <div style='min-width:0'>
        <strong style='font-size:.95rem;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>Rascademy</strong>
        <div class='mut' style='font-size:.73rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>Lv.${lv.lv} • ${rk.name}</div>
      </div>
    </div>
    <div class='row' style='gap:6px;flex:none'>
      <span class='tag' style='margin:0;padding:2px 9px;white-space:nowrap'>🛡️ ${getShields()}/3</span>
      <span class='tag ok' style='margin:0;padding:2px 9px;white-space:nowrap'>⚡ ${S.w.xp} XP</span>
    </div>`;

  if (S.tab === 'belajar') {
    if (S.quick) renderQuickReview();
    else renderLesson();
  } else if (S.tab === 'duel') {
    tabDuel();
  } else {
    tabProfil();
  }
}

function goTab(k) {
  if (S.tab === 'belajar' && !S.les && !S.quick) saveMap();
  if (k !== 'duel' && S.du) exitDuel();
  if (S.vid) closeVideoModal(true);
  S.tab = k;
  S.les = null;
  S.quick = null;
  modal('');
  render();
}

render();
</script>
</body>
</html>
